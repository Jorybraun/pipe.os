<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agents of Chaos - AI Hackathon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="slide-container">
        <!-- Brand Layout -->
        <div class="brand-top-left">
            <span class="brand-agents">AGENTS OF</span>
            <span class="brand-chaos">CHAOS</span>
        </div>
        
        <div class="brand-top-right">
            <div class="devin-logo">
                <!-- Devin logo placeholder -->
                <div class="devin-mark"></div>
                <span class="devin-wordmark">Devin</span>
            </div>
        </div>
        
        <div class="brand-bottom-right">
            <span class="cognition-logo">Cognition</span>
        </div>
        
        <div class="brand-bottom-left">
            <span class="slide-number">01_</span>
        </div>
        
        <div class="terminal-microcopy">
            > init chaos.exe
        </div>
        
        <!-- Terminal microcopy options (rotate these):
        > init chaos.exe
        > purpose: explore
        > constraints: loose
        > safety: sandboxed
        > creativity: max
        > connected();
        // unpredictable
        // undefined
        // ungoverned
        // generative
        > _
        -->
        
        <!-- Slide Content -->
        <div class="slide-content">
            <h1 class="slide-title">AGENTS OF CHAOS</h1>
            <h2 class="slide-subtitle">July 4 AI Hackathon</h2>
            <p class="slide-location">Funk Coffee · Vancouver · 10:00 AM–4:00 PM</p>
            <p class="slide-body">Build something useful, weird, satirical, disruptive, beautiful, or barely holding together.</p>
            <p class="slide-footer">Chaos is undefined, unpredictable, and generative.</p>
        </div>
        
        <!-- Butterfly Animation Container -->
        <div class="butterfly-container">
            <canvas id="butterflyCanvas"></canvas>
        </div>
    </div>
    
    <script src="butterfly.js"></script>
    <script src="script.js"></script>
</body>
</html>
