[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "MCP server for orchestrating multi-agent development workflows with queue-based telemetry"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0",
    "websockets>=14.0",
    "sqlite-utils>=3.36",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-experimental>=0.3.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
agent-harness = "agent_harness.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]
