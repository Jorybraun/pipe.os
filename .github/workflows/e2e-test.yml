name: E2E Test Environment

# Deploys the worker + Pages preview to the test environment, resets + seeds
# the test D1, and runs the Playwright suite against the real backend.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN        — account-scoped token with Workers/D1/R2/Vectorize/Pages edit
#   CLOUDFLARE_ACCOUNT_ID
#   CLERK_PUBLISHABLE_KEY_TEST  — Clerk dev instance publishable key (for Vite build)
#   TEST_API_BASE               — e.g. https://pipe-api-test.<subdomain>.workers.dev
#   TEST_APP_BASE               — e.g. https://pipe-app-test.pages.dev
#   E2E_EMAIL                   — optional Clerk test user email override
#   E2E_PASSWORD                — optional Clerk test user password override
#   TEST_VIDEO_ROOM_BASE        — optional override for the deployed room worker URL
#   CRAWLER_GITHUB_TOKEN        — optional GitHub API override for live review packet backfill
#
# Remote E2E is opt-in for pull requests because it requires a fully
# provisioned Cloudflare Pages test project and real Clerk test credentials.
# Set repository variable RUN_REMOTE_E2E=true, or use the manual workflow input,
# to enable this job.
# Set RUN_LIVE_REVIEW_PACKET_E2E=true, or use the manual workflow input, to
# seed + backfill a real source-backed review challenge packet before Playwright.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      remote_e2e:
        description: 'Deploy and run the remote Cloudflare test environment E2E lane'
        required: true
        default: false
        type: boolean
      live_review_packet_e2e:
        description: 'Seed/backfill mui/base-ui#973 and run the browser match proof against that persisted packet'
        required: true
        default: false
        type: boolean

jobs:
  e2e:
    name: E2E (test env)
    runs-on: ubuntu-latest
    env:
      REMOTE_E2E: ${{ (vars.RUN_REMOTE_E2E == 'true' || inputs.remote_e2e == true) && 'true' || 'false' }}
      LIVE_REVIEW_PACKET_E2E: ${{ (vars.RUN_LIVE_REVIEW_PACKET_E2E == 'true' || inputs.live_review_packet_e2e == true) && 'true' || 'false' }}
      TEST_D1_DATABASE_ID: 0abe92df-9296-46f5-9f9d-a1fb1bcd3be1
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remote E2E disabled
        if: env.REMOTE_E2E != 'true'
        run: |
          echo "Remote E2E is disabled for this repository."
          echo "Set repository variable RUN_REMOTE_E2E=true, or use workflow_dispatch input remote_e2e=true."

      - name: Validate remote E2E configuration
        if: env.REMOTE_E2E == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_PUBLISHABLE_KEY_TEST: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
          TEST_API_BASE: ${{ secrets.TEST_API_BASE }}
          TEST_APP_BASE: ${{ secrets.TEST_APP_BASE }}
          TEST_VIDEO_ROOM_BASE: ${{ secrets.TEST_VIDEO_ROOM_BASE }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            CLERK_PUBLISHABLE_KEY_TEST
            TEST_API_BASE
            TEST_APP_BASE
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required remote E2E secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          for name in TEST_API_BASE TEST_APP_BASE; do
            case "${!name}" in
              http://*|https://*) ;;
              *)
                printf '%s must be an absolute http(s) URL\n' "$name" >&2
                exit 1
                ;;
            esac
          done
          if [ -n "$TEST_VIDEO_ROOM_BASE" ]; then
            case "$TEST_VIDEO_ROOM_BASE" in
              http://*|https://*) ;;
              *)
                printf 'TEST_VIDEO_ROOM_BASE must be an absolute http(s) URL when provided\n' >&2
                exit 1
                ;;
            esac
          fi
          echo "Remote E2E configuration is present. live_review_packet_e2e=$LIVE_REVIEW_PACKET_E2E"

      - name: Set up Node.js
        if: env.REMOTE_E2E == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (frontend)
        if: env.REMOTE_E2E == 'true'
        run: npm ci

      - name: Install dependencies (worker)
        if: env.REMOTE_E2E == 'true'
        working-directory: workers/api
        run: npm ci

      - name: Install dependencies (assessment room)
        if: env.REMOTE_E2E == 'true'
        working-directory: apps/video-room
        run: npm install --no-audit --no-fund

      - name: Apply D1 migrations (test)
        if: env.REMOTE_E2E == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: d1 migrations apply pipe-db-test --env test --remote

      - name: Build frontend (test target)
        if: env.REMOTE_E2E == 'true'
        env:
          VITE_API_BASE: ${{ secrets.TEST_API_BASE }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
        run: npm run build

      - name: Build assessment room (test target)
        if: env.REMOTE_E2E == 'true'
        working-directory: apps/video-room
        run: npm run build

      - name: Deploy Pages (test)
        if: env.REMOTE_E2E == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: pipe-app-test
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure assessment room test API origin
        if: env.REMOTE_E2E == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEST_API_BASE: ${{ secrets.TEST_API_BASE }}
        run: printf '%s' "$TEST_API_BASE" | ./workers/api/node_modules/.bin/wrangler secret put API_ORIGIN --config apps/video-room/wrangler.jsonc --env test

      - name: Deploy assessment room (test)
        if: env.REMOTE_E2E == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
          TEST_VIDEO_ROOM_BASE: ${{ secrets.TEST_VIDEO_ROOM_BASE }}
        run: |
          deploy_output="$(./workers/api/node_modules/.bin/wrangler deploy --config apps/video-room/wrangler.jsonc --env test 2>&1)"
          printf '%s\n' "$deploy_output"
          video_room_base="$TEST_VIDEO_ROOM_BASE"
          if [ -z "$video_room_base" ]; then
            video_room_base="$(printf '%s\n' "$deploy_output" | sed -nE 's#.*(https://pipe-room-test[.][^[:space:]]+[.]workers[.]dev).*#\1#p' | tail -n 1)"
          fi
          if [ -z "$video_room_base" ]; then
            video_room_base="$(node -e 'const token=process.env.CLOUDFLARE_API_TOKEN; const accountId=process.env.CLOUDFLARE_ACCOUNT_ID; if(!token||!accountId) process.exit(1); fetch("https://api.cloudflare.com/client/v4/accounts/"+accountId+"/workers/subdomain",{headers:{Authorization:"Bearer "+token}}).then(async response=>{const payload=await response.json(); const subdomain=payload&&payload.result&&payload.result.subdomain; if(!response.ok||!payload.success||typeof subdomain!=="string"||subdomain.length===0) process.exit(1); console.log("https://pipe-room-test."+subdomain+".workers.dev");}).catch(()=>process.exit(1));')"
          fi
          if [ -z "$video_room_base" ]; then
            echo "Could not resolve deployed assessment room URL from Wrangler output. Set TEST_VIDEO_ROOM_BASE as an override." >&2
            exit 1
          fi
          echo "VIDEO_ROOM_BASE=$video_room_base" >> "$GITHUB_ENV"
          echo "Resolved assessment room base: $video_room_base"

      - name: Configure API test room URL
        if: env.REMOTE_E2E == 'true'
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$VIDEO_ROOM_BASE" | npx wrangler secret put VIDEO_ROOM_APP_URL --env test

      - name: Deploy Worker (test)
        if: env.REMOTE_E2E == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy --env test

      - name: Wait for worker health
        if: env.REMOTE_E2E == 'true'
        run: |
          deadline=$((SECONDS+60))
          until curl -fsS "${{ secrets.TEST_API_BASE }}/health" >/dev/null 2>&1; do
            if [ $SECONDS -ge $deadline ]; then
              echo "Worker health check timed out after 60s" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Wait for assessment room health
        if: env.REMOTE_E2E == 'true'
        run: |
          deadline=$((SECONDS+60))
          until curl -fsS "$VIDEO_ROOM_BASE" >/dev/null 2>&1; do
            if [ $SECONDS -ge $deadline ]; then
              echo "Video room health check timed out after 60s" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Reset test DB
        if: env.REMOTE_E2E == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: d1 execute pipe-db-test --env test --remote --file scripts/reset-test-db.sql

      - name: Seed test DB
        if: env.REMOTE_E2E == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: d1 execute pipe-db-test --env test --remote --file scripts/seed-test-db.sql

      - name: Seed live review packet input
        if: env.REMOTE_E2E == 'true' && env.LIVE_REVIEW_PACKET_E2E == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: d1 execute pipe-db-test --env test --remote --file scripts/seed-live-review-packet-input.sql

      - name: Backfill live review packet
        if: env.REMOTE_E2E == 'true' && env.LIVE_REVIEW_PACKET_E2E == 'true'
        working-directory: workers/api
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWLER_GITHUB_TOKEN || github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ env.TEST_D1_DATABASE_ID }}
        run: |
          npx tsx scripts/backfillReviewChallengePackets.ts \
            --remote \
            --repo mui/base-ui \
            --pr 973 \
            --batch-size 1 \
            --json \
            > live-review-packet-backfill.json \
            2> >(tee live-review-packet-backfill.log >&2)
          cat live-review-packet-backfill.json
          npm run review-graph:backfill-report-gate -- \
            --file live-review-packet-backfill.json \
            --expected-mode write \
            --min-ready 1 \
            --json | tee live-review-packet-backfill-gate.json
          npx tsx scripts/prepareLiveReviewPacketE2EEnv.ts \
            --file live-review-packet-backfill.json \
            --repo mui/base-ui \
            --pr 973

      - name: Install Playwright browsers
        if: env.REMOTE_E2E == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        if: env.REMOTE_E2E == 'true'
        env:
          API_BASE: ${{ secrets.TEST_API_BASE }}
          APP_BASE: ${{ secrets.TEST_APP_BASE }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
        run: npx playwright test --workers=1

      - name: Upload Playwright report
        if: always() && env.REMOTE_E2E == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            workers/api/live-review-packet-backfill.json
            workers/api/live-review-packet-backfill-gate.json
            workers/api/live-review-packet-backfill.log
          if-no-files-found: ignore
          retention-days: 7
