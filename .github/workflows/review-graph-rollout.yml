name: Review Graph Rollout

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run a dry-run build or persist review challenge packets'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - backfill
      batch_size:
        description: 'Maximum eligible PR rows to process'
        required: true
        default: '1'
      repo:
        description: 'Optional OWNER/NAME repo filter'
        required: false
        default: ''
      pr:
        description: 'Optional pull request number filter'
        required: false
        default: ''
      apply_migrations:
        description: 'Apply production D1 migrations before checking/backfilling'
        required: true
        default: false
        type: boolean
      prepare_graph_schema_only:
        description: 'Execute only review-graph schema SQL files with d1 execute; does not update Wrangler migration ledger'
        required: true
        default: false
        type: boolean
      allow_extra_pending_migrations:
        description: 'Allow applying unrelated pending production D1 migrations in the same batch'
        required: true
        default: false
        type: boolean

jobs:
  rollout:
    name: Review Graph Rollout
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/api/package-lock.json

      - name: Install dependencies
        working-directory: workers/api
        run: npm ci

      - name: Initial review graph readiness
        continue-on-error: true
        working-directory: workers/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: npm run review-graph:remote-readiness | tee review-graph-readiness-before.json

      - name: Validate migration mode
        if: ${{ inputs.apply_migrations && inputs.prepare_graph_schema_only }}
        run: |
          echo "Choose either apply_migrations or prepare_graph_schema_only, not both." >&2
          exit 1

      - name: Plan production D1 migrations
        if: ${{ inputs.apply_migrations }}
        working-directory: workers/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          ALLOW_EXTRA_PENDING_MIGRATIONS: ${{ inputs.allow_extra_pending_migrations }}
        run: |
          npx wrangler d1 migrations list pipe-db --env production --remote \
            | tee review-graph-migrations-pending.txt
          args=(--file review-graph-migrations-pending.txt --json)
          if [ "$ALLOW_EXTRA_PENDING_MIGRATIONS" = "true" ]; then
            args+=(--allow-extra-pending)
          fi
          npx tsx scripts/checkReviewGraphMigrationPlan.ts "${args[@]}" \
            | tee review-graph-migration-plan.json

      - name: Apply production D1 migrations
        if: ${{ inputs.apply_migrations }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: d1 migrations apply pipe-db --env production --remote

      - name: Prepare review graph schema only
        if: ${{ inputs.prepare_graph_schema_only }}
        working-directory: workers/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          mkdir -p review-graph-schema-prep
          for migration in \
            0082_living_context_graph.sql \
            0083_repo_semantic_graph_and_match_runs.sql \
            0095_context_records.sql
          do
            echo "::group::review graph schema: $migration"
            npx wrangler d1 execute pipe-db \
              --env production \
              --remote \
              --file "migrations/$migration" \
              --yes \
              | tee "review-graph-schema-prep/$migration.log"
            echo "::endgroup::"
          done

      - name: Schema readiness after migrations
        if: ${{ inputs.apply_migrations || inputs.prepare_graph_schema_only }}
        working-directory: workers/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: npm run review-graph:remote-schema-readiness | tee review-graph-readiness-after-migrations.json

      - name: GitHub API preflight
        working-directory: workers/api
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWLER_GITHUB_TOKEN }}
        run: npx tsx scripts/backfillReviewChallengePackets.ts --preflight-github

      - name: Run review packet backfill
        working-directory: workers/api
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWLER_GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          REVIEW_GRAPH_MODE: ${{ inputs.mode }}
          REVIEW_GRAPH_BATCH_SIZE: ${{ inputs.batch_size }}
          REVIEW_GRAPH_REPO: ${{ inputs.repo }}
          REVIEW_GRAPH_PR: ${{ inputs.pr }}
        run: |
          if ! [[ "$REVIEW_GRAPH_BATCH_SIZE" =~ ^[1-9][0-9]*$ ]]; then
            echo "batch_size must be a positive integer" >&2
            exit 1
          fi
          if [ -n "$REVIEW_GRAPH_REPO" ] && ! [[ "$REVIEW_GRAPH_REPO" =~ ^[^[:space:]/]+/[^[:space:]/]+$ ]]; then
            echo "repo must use OWNER/NAME format" >&2
            exit 1
          fi
          if [ -n "$REVIEW_GRAPH_PR" ] && ! [[ "$REVIEW_GRAPH_PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "pr must be a positive integer" >&2
            exit 1
          fi

          args=(--remote --batch-size "$REVIEW_GRAPH_BATCH_SIZE")
          if [ "$REVIEW_GRAPH_MODE" = "dry-run" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$REVIEW_GRAPH_REPO" ]; then
            args+=(--repo "$REVIEW_GRAPH_REPO")
          fi
          if [ -n "$REVIEW_GRAPH_PR" ]; then
            args+=(--pr "$REVIEW_GRAPH_PR")
          fi
          npx tsx scripts/backfillReviewChallengePackets.ts "${args[@]}" --json \
            > review-graph-backfill.json \
            2> >(tee review-graph-backfill.log >&2)
          cat review-graph-backfill.json

      - name: Validate review packet backfill report
        working-directory: workers/api
        env:
          REVIEW_GRAPH_MODE: ${{ inputs.mode }}
        run: |
          npm run review-graph:backfill-report-gate -- \
            --file review-graph-backfill.json \
            --expected-mode "$REVIEW_GRAPH_MODE" \
            --json | tee review-graph-backfill-gate.json

      - name: Final review graph readiness
        if: always()
        continue-on-error: ${{ inputs.mode == 'dry-run' }}
        working-directory: workers/api
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWLER_GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: npm run review-graph:remote-readiness -- --require-github | tee review-graph-readiness-final.json

      - name: Upload review graph rollout artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-graph-rollout-${{ github.run_id }}
          path: |
            workers/api/review-graph-readiness-before.json
            workers/api/review-graph-migrations-pending.txt
            workers/api/review-graph-migration-plan.json
            workers/api/review-graph-schema-prep/*.log
            workers/api/review-graph-readiness-after-migrations.json
            workers/api/review-graph-readiness-final.json
            workers/api/review-graph-backfill.json
            workers/api/review-graph-backfill-gate.json
            workers/api/review-graph-backfill.log
          if-no-files-found: ignore
          retention-days: 14
