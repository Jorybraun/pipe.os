name: Deploy Dev Demo

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    name: Deploy Dev Demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (frontend)
        run: npm ci

      - name: Install dependencies (worker)
        working-directory: workers/api
        run: npm ci

      - name: Install dependencies (video room)
        working-directory: apps/video-room
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Build video room
        working-directory: apps/video-room
        run: npm run build

      - name: Deploy API (dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy --env dev

      - name: Deploy app shell (dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/app
          command: deploy

      - name: Deploy video room (dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/video-room
          command: deploy
