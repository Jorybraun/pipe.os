name: Deploy Dev Demo

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    name: Deploy Dev Demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (frontend)
        run: npm ci

      - name: Install dependencies (worker)
        working-directory: workers/api
        run: npm ci

      - name: Install dependencies (assessment room)
        working-directory: apps/video-room
        run: npm install --no-audit --no-fund

      - name: Build frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
        run: npm run build

      - name: Build assessment room
        working-directory: apps/video-room
        run: npm run build

      - name: Deploy API (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./workers/api/node_modules/.bin/wrangler deploy --config workers/api/wrangler.jsonc --env dev

      - name: Deploy app shell (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./workers/api/node_modules/.bin/wrangler deploy --config workers/app/wrangler.jsonc

      - name: Deploy assessment room (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./workers/api/node_modules/.bin/wrangler deploy --config apps/video-room/wrangler.jsonc
