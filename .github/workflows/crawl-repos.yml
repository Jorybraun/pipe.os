name: Repo Crawler

# Scheduled runs:
#   Pass 1 (search + coarse filter): weekly on Monday 02:00 UTC
#   Pass 2 (clone + deep analysis):  weekly on Monday 04:00 UTC (after pass-1)
#
# Manual runs: use the workflow_dispatch trigger for one-off crawls.

on:
  schedule:
    # Pass 1 — weekly, Monday 02:00 UTC
    - cron: '0 2 * * 1'
    # Pass 2 — weekly, Monday 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      pass:
        description: 'Which pass to run (pass1, pass2, both)'
        required: true
        default: 'both'
        type: choice
        options: [pass1, pass2, both]
      limit:
        description: 'Override batch size (e.g. 50 for test run)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (print without writing to D1)'
        required: false
        default: 'false'
        type: boolean

jobs:
  crawl:
    name: Crawl Repos
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/api/package-lock.json

      - name: Install dependencies
        working-directory: workers/api
        run: npm ci

      # scc for SLOC measurement (optional — crawler degrades gracefully if absent)
      - name: Install scc
        continue-on-error: true
        run: |
          curl -sSL https://github.com/boyter/scc/releases/download/v3.3.4/scc_Linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin scc
          scc --version

      # lizard for cyclomatic complexity (optional)
      - name: Install lizard
        continue-on-error: true
        run: |
          pip install lizard --quiet
          lizard --version

      # Determine which passes to run based on trigger
      - name: Determine passes
        id: passes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.pass }}"
          else
            # Scheduled: 02:xx = pass1, 04:xx = pass2
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "02" ]; then
              INPUT="pass1"
            else
              INPUT="pass2"
            fi
          fi
          echo "run_pass1=$([ "$INPUT" = "pass1" ] || [ "$INPUT" = "both" ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
          echo "run_pass2=$([ "$INPUT" = "pass2" ] || [ "$INPUT" = "both" ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

      - name: Run Pass 1 — search + coarse filter
        if: steps.passes.outputs.run_pass1 == 'true'
        working-directory: workers/api
        env:
          GITHUB_TOKEN:               ${{ secrets.CRAWLER_GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:       ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID:  ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          LOG_LEVEL: info
        run: |
          ARGS="--pass1"
          [ -n "${{ github.event.inputs.limit }}" ] && ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          npx tsx scripts/crawl-repos/index.ts $ARGS

      - name: Run Pass 2 — clone + deep analysis
        if: steps.passes.outputs.run_pass2 == 'true'
        working-directory: workers/api
        env:
          GITHUB_TOKEN:               ${{ secrets.CRAWLER_GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:       ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID:  ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          PASS2_BATCH_SIZE:           ${{ github.event.inputs.limit || '200' }}
          PASS2_CONCURRENCY:          '4'
          LOG_LEVEL: info
        run: |
          ARGS="--pass2"
          [ -n "${{ github.event.inputs.limit }}" ] && ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          npx tsx scripts/crawl-repos/index.ts $ARGS

      - name: Review graph readiness report
        if: always() && steps.passes.outputs.run_pass2 == 'true'
        continue-on-error: true
        working-directory: workers/api
        env:
          GITHUB_TOKEN:               ${{ secrets.CRAWLER_GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:       ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID:  ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          npm run review-graph:remote-readiness -- --require-github > review-graph-readiness.json
          cat review-graph-readiness.json

      - name: Upload review graph readiness report
        if: always() && steps.passes.outputs.run_pass2 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: review-graph-readiness-${{ github.run_id }}
          path: workers/api/review-graph-readiness.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-logs-${{ github.run_id }}
          path: /tmp/pipe-crawl/
          retention-days: 3
