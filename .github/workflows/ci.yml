name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (frontend)
        run: npm ci

      - name: Install dependencies (worker)
        working-directory: workers/api
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Typecheck worker
        working-directory: workers/api
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (frontend)
        run: npm run test

      - name: Unit tests (worker)
        working-directory: workers/api
        run: npx vitest run

      - name: Build frontend
        run: npm run build
