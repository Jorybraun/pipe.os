name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (frontend)
        run: npm ci

      - name: Install dependencies (worker)
        working-directory: workers/api
        run: npm ci

      - name: Install dependencies (assessment room)
        working-directory: apps/video-room
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Typecheck worker
        working-directory: workers/api
        run: npx tsc --noEmit

      - name: Typecheck assessment room
        working-directory: apps/video-room
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests (frontend)
        timeout-minutes: 10
        run: npm run test

      - name: Unit tests (assessment room)
        working-directory: apps/video-room
        run: npm run test

      - name: Unit tests (worker)
        timeout-minutes: 15
        working-directory: workers/api
        run: npx vitest run

      - name: Matching evaluation readiness report
        working-directory: workers/api
        env:
          CLOUDFLARE_ACCOUNT_ID:      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:       ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID:  ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          MATCHING_EVALUATION_D1_DATABASE_ID: ${{ vars.MATCHING_EVALUATION_D1_DATABASE_ID }}
          MATCHING_EVALUATION_CORPUS_ID: ${{ vars.MATCHING_EVALUATION_CORPUS_ID }}
          MATCHING_EVALUATION_REQUIRED: ${{ vars.MATCHING_EVALUATION_REQUIRED }}
          MATCHING_EVALUATION_STAGE: ${{ vars.MATCHING_EVALUATION_STAGE }}
        run: |
          EVAL_STAGE="${MATCHING_EVALUATION_STAGE:-production}"
          REQUIRE_MATCHING_EVALUATION="${MATCHING_EVALUATION_REQUIRED:-0}"
          if [ -n "$MATCHING_EVALUATION_D1_DATABASE_ID" ]; then
            export CLOUDFLARE_D1_DATABASE_ID="$MATCHING_EVALUATION_D1_DATABASE_ID"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_D1_DATABASE_ID" ] || [ -z "$MATCHING_EVALUATION_CORPUS_ID" ]; then
            cat > matching-evaluation-readiness.json <<'JSON'
          {
            "ready": false,
            "status": "not_configured",
            "failures": [
              "Set CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, CLOUDFLARE_D1_DATABASE_ID or MATCHING_EVALUATION_D1_DATABASE_ID, and MATCHING_EVALUATION_CORPUS_ID to run the matching evaluation readiness report."
            ]
          }
          JSON
            cat matching-evaluation-readiness.json
            if [ "$REQUIRE_MATCHING_EVALUATION" = "1" ] || [ "$REQUIRE_MATCHING_EVALUATION" = "true" ]; then
              echo "Production matching evaluation readiness is required for pushes to main."
              exit 1
            fi
            echo "Production matching evaluation readiness is not configured; uploaded non-blocking readiness report."
            exit 0
          fi
          npm run matching-eval:readiness -- \
            --corpus-id "$MATCHING_EVALUATION_CORPUS_ID" \
            --stage "$EVAL_STAGE" \
            --json matching-evaluation-readiness.json \
            --report matching-evaluation-readiness.txt
          cat matching-evaluation-readiness.json

      - name: Upload matching evaluation readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-evaluation-readiness-${{ github.run_id }}
          path: |
            workers/api/matching-evaluation-readiness.json
            workers/api/matching-evaluation-readiness.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Build frontend
        run: npm run build
