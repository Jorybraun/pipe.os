<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PIPE OS — PM Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0c0e;color:rgba(255,255,255,0.87);font-family:'Space Mono','Courier New',monospace;font-size:11px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
input,textarea,select{font-family:inherit}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.toast{animation:fadeIn 0.2s ease-out;position:fixed;top:12px;right:12px;z-index:9999;padding:10px 16px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.08em;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.search-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9000;display:flex;justify-content:center;padding-top:15vh}
.search-box{width:560px;max-height:400px;background:#1a1a2e;border:1px solid rgba(255,255,255,0.15);border-radius:10px;overflow:hidden}
.search-box input{width:100%;padding:14px 16px;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.08);color:#fff;font-size:13px;outline:none}
.search-result{padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background 0.1s}
.search-result:hover,.search-result.active{background:rgba(59,130,246,0.12)}
.tab-bar{display:flex;gap:2px;border-bottom:1px solid rgba(255,255,255,0.07);margin-bottom:12px}
.tab-btn{padding:8px 14px;background:transparent;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,0.35);font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:all 0.15s}
.tab-btn.active{color:rgba(255,255,255,0.9);border-bottom-color:#3b82f6}
.tab-btn:hover{color:rgba(255,255,255,0.6)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

// ─── INIT ───────────────────────────────────────────────────
mermaid.initialize({startOnLoad:false,theme:'dark',themeVariables:{background:'#0c0c0e',primaryColor:'#1e1e2e',primaryTextColor:'rgba(255,255,255,0.7)',primaryBorderColor:'rgba(255,255,255,0.1)',lineColor:'rgba(255,255,255,0.2)',edgeLabelBackground:'#0c0c0e',fontSize:'10px'}});

// ─── THEME ──────────────────────────────────────────────────
const T={bg:"#0c0c0e",surface:"rgba(255,255,255,0.03)",hover:"rgba(255,255,255,0.06)",glass:"rgba(255,255,255,0.04)",border:"rgba(255,255,255,0.07)",borderA:"rgba(255,255,255,0.14)",text:"rgba(255,255,255,0.55)",dim:"rgba(255,255,255,0.25)",bright:"#fff",accent:"#3b82f6",accentD:"rgba(59,130,246,0.12)",green:"#10b981",red:"#ef4444",redD:"rgba(239,68,68,0.10)",yellow:"#f59e0b",violet:"rgba(139,92,246,0.8)",violetD:"rgba(139,92,246,0.10)",orange:"#f97316"};
const SC={working:T.green,complete:T.green,partial:T.yellow,exists:T.yellow,broken:T.red,blocked:T.red,missing:T.dim,stub:T.dim,todo:T.accent,in_progress:T.yellow,done:T.green,proposed:T.yellow,open:T.red,draft:T.orange,pass:T.green,fail:T.red};

// ─── API HELPERS ────────────────────────────────────────────
const api={
  get:u=>fetch(u).then(r=>r.json()),
  post:(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()),
  del:(u,b)=>fetch(u,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()),
};

// ─── PRIMITIVES ─────────────────────────────────────────────
function Dot({s,sz=6}){return <span style={{display:"inline-block",width:sz,height:sz,borderRadius:"50%",background:SC[s]||T.dim,flexShrink:0}}/>;}
function Tag({l,c=T.accent}){return <span style={{fontSize:8,fontWeight:700,color:c,background:`${c}18`,padding:"2px 7px",borderRadius:3,letterSpacing:"0.08em",textTransform:"uppercase",whiteSpace:"nowrap"}}>{l}</span>;}
function Card({title,ch,right,style,noPad}){return <div style={{background:T.glass,border:`1px solid ${T.border}`,borderRadius:10,overflow:"hidden",...style}}>{title&&<div style={{padding:"9px 14px",borderBottom:`1px solid ${T.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:8,fontWeight:700,color:T.dim,textTransform:"uppercase",letterSpacing:"0.35em"}}>{title}</span>{right}</div>}<div style={noPad?{}:{padding:"12px 14px"}}>{ch}</div></div>;}
function Btn({children,onClick,v="default",full,sx,disabled}){const s={default:{background:T.accentD,border:`1px solid ${T.accent}25`,color:T.accent},primary:{background:T.accent,border:"none",color:T.bg},ghost:{background:"transparent",border:`1px solid ${T.border}`,color:T.text},sync:{background:T.violetD,border:`1px solid rgba(139,92,246,0.3)`,color:T.violet},danger:{background:T.redD,border:`1px solid rgba(239,68,68,0.3)`,color:T.red}};return <button onClick={onClick} disabled={disabled} style={{padding:"6px 13px",borderRadius:4,cursor:disabled?"not-allowed":"pointer",fontSize:9,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",width:full?"100%":undefined,fontFamily:"inherit",opacity:disabled?0.5:1,...(s[v]||s.default),...sx}}>{children}</button>;}
function Input({value,onChange,placeholder,style}){return <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%",padding:"6px 8px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:4,color:T.text,fontSize:10,fontFamily:"inherit",outline:"none",...style}}/>;}
function TextArea({value,onChange,placeholder,rows=3,style}){return <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows} style={{width:"100%",padding:"6px 8px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:4,color:T.text,fontSize:10,fontFamily:"inherit",outline:"none",resize:"vertical",...style}}/>;}
function Select({value,onChange,options,style}){return <select value={value} onChange={e=>onChange(e.target.value)} style={{padding:"6px 8px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:4,color:T.text,fontSize:10,fontFamily:"inherit",outline:"none",...style}}>{options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select>;}
function Badge({count,color=T.red}){if(!count)return null;return <span style={{fontSize:8,fontWeight:700,color:T.bg,background:color,borderRadius:8,padding:"1px 5px",minWidth:14,textAlign:"center"}}>{count}</span>;}
function EmptyState({icon="◈",text}){return <div style={{textAlign:"center",padding:"32px 0",color:T.dim}}><div style={{fontSize:20,marginBottom:8}}>{icon}</div><div style={{fontSize:10}}>{text}</div></div>;}

// ─── MERMAID ────────────────────────────────────────────────
function MermaidChart({chart,id}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||!chart)return;
    ref.current.innerHTML="";
    const cleaned=chart.replace(/\\n/g,'\n');
    mermaid.render(`m-${id}-${Date.now()}`,cleaned)
      .then(({svg})=>{if(ref.current)ref.current.innerHTML=svg;})
      .catch(()=>{if(ref.current)ref.current.innerHTML=`<span style="color:${T.dim};font-size:8px">Diagram parse error</span>`;});
  },[chart,id]);
  return <div ref={ref} style={{fontSize:9,overflowX:"auto"}}/>;
}

// ─── TOAST ──────────────────────────────────────────────────
function useToast(){
  const [toasts,setToasts]=useState([]);
  const show=useCallback((msg,type='info')=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3000);
  },[]);
  const el=toasts.map(t=><div key={t.id} className="toast" style={{background:t.type==='error'?'rgba(239,68,68,0.9)':t.type==='success'?'rgba(16,185,129,0.9)':'rgba(59,130,246,0.9)',color:'#fff'}}>{t.msg}</div>);
  return {show,el};
}

// ─── SEARCH MODAL (CMD+K) ──────────────────────────────────
function SearchModal({open,onClose,onNavigate}){
  const [q,setQ]=useState('');
  const [results,setResults]=useState([]);
  const [active,setActive]=useState(0);
  const inputRef=useRef(null);

  useEffect(()=>{if(open){setQ('');setResults([]);setActive(0);setTimeout(()=>inputRef.current?.focus(),50)}},[open]);
  useEffect(()=>{
    if(!q.trim()){setResults([]);return;}
    const t=setTimeout(()=>api.get(`/api/search?q=${encodeURIComponent(q)}`).then(d=>setResults(d.results||[])),200);
    return()=>clearTimeout(t);
  },[q]);

  const handleKey=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();setActive(p=>Math.min(p+1,results.length-1))}
    if(e.key==='ArrowUp'){e.preventDefault();setActive(p=>Math.max(p-1,0))}
    if(e.key==='Enter'&&results[active]){onNavigate(results[active]);onClose()}
    if(e.key==='Escape')onClose();
  };

  if(!open)return null;
  const typeIcons={feature:'📄',journey:'🔄',bug:'🐛',request:'💡',task:'✅',lambda:'λ',entity:'◆'};
  return <div className="search-overlay" onClick={onClose}>
    <div className="search-box" onClick={e=>e.stopPropagation()}>
      <input ref={inputRef} value={q} onChange={e=>setQ(e.target.value)} onKeyDown={handleKey} placeholder="Search features, tasks, bugs, lambdas, entities..." />
      <div style={{maxHeight:320,overflowY:'auto'}}>
        {results.map((r,i)=><div key={i} className={`search-result ${i===active?'active':''}`} onClick={()=>{onNavigate(r);onClose()}} onMouseEnter={()=>setActive(i)}>
          <span style={{fontSize:12}}>{typeIcons[r.type]||'•'}</span>
          <div style={{flex:1,minWidth:0}}><div style={{fontSize:10,color:T.bright,fontWeight:600}}>{r.title}</div><div style={{fontSize:8,color:T.dim}}>{r.type} · {r.sub}</div></div>
        </div>)}
        {q&&!results.length&&<div style={{padding:16,textAlign:'center',color:T.dim,fontSize:9}}>No results</div>}
      </div>
    </div>
  </div>;
}

// ─── SYNC TERMINAL ──────────────────────────────────────────
function SyncTerminal({output,running}){
  const ref=useRef(null);
  useEffect(()=>{ref.current?.scrollIntoView({behavior:"smooth"});},[output]);
  return <div style={{marginBottom:12,borderRadius:6,border:`1px solid ${running?"rgba(139,92,246,0.4)":T.border}`,overflow:"hidden"}}>
    <div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 12px",background:"rgba(139,92,246,0.07)",borderBottom:`1px solid ${T.border}`}}>
      <span style={{width:7,height:7,borderRadius:"50%",background:running?T.violet:T.green,animation:running?"pulse 1s infinite":undefined}}/>
      <span style={{fontSize:8,fontWeight:700,color:running?T.violet:T.green,letterSpacing:"0.15em"}}>{running?"CLAUDE READING CODEBASE...":"ASSESSMENT COMPLETE"}</span>
    </div>
    <div style={{background:"#080810",padding:"10px 14px",maxHeight:260,overflowY:"auto",fontSize:9,color:"rgba(255,255,255,0.6)",lineHeight:1.7,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>
      {output||<span style={{color:T.dim}}>Starting Claude...</span>}
      <div ref={ref}/>
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════════════
//  OVERVIEW
// ═══════════════════════════════════════════════════════════════
function Overview({data,setView,setSelPage,toast,onReload}){
  const F=data.features||[],L=data.lambdas||[],tasks=data.tasks||[];
  const tJ=F.reduce((a,f)=>a+(f.journeys||[]).length,0);
  const pJ=F.reduce((a,f)=>a+(f.journeys||[]).filter(j=>j.status==="working").length,0);
  const bddJ=F.reduce((a,f)=>a+(f.journeys||[]).filter(j=>j.bdd).length,0);
  const bugs=F.reduce((a,f)=>a+(f.bugs||[]).filter(b=>b.status==="open").length,0);
  const todoTasks=tasks.filter(t=>["todo","in_progress"].includes(t.status));
  const blockers=[...tasks.filter(t=>t.status==="blocked"),...F.flatMap(f=>(f.bugs||[]).filter(b=>b.status==="open"&&["P0","P1"].includes(b.severity)).map(b=>({...b,_featureName:f.name,_type:'bug'})))];

  const [syncing,setSyncing]=useState(false);

  const doKnowledgeSync=async()=>{
    setSyncing(true);
    try{
      const r=await api.post('/api/knowledge-sync',{includeStrategyDocs:false});
      if(r.ok){
        toast.show(`Synced ${r.added} tasks from /knowledge/plan`,'success');
        onReload();
      }else{
        toast.show(r.error||'Sync failed','error');
      }
    }catch(e){
      toast.show('Sync failed: '+e.message,'error');
    }
    setSyncing(false);
  };

  const stats=[
    {v:F.length,c:T.accent,l:"ROUTES",s:`${F.filter(f=>f.status==="working").length} working`},
    {v:tJ,c:T.green,l:"JOURNEYS",s:`${pJ} passing`},
    {v:L.length,c:T.violet,l:"LAMBDAS",s:`${L.filter(l=>l.status==="complete").length} complete`},
    {v:`${tJ?Math.round(bddJ/tJ*100):0}%`,c:bddJ===tJ?T.green:T.yellow,l:"BDD COV",s:`${bddJ}/${tJ} specs`},
    {v:bugs,c:bugs>0?T.red:T.green,l:"BUGS",s:"open"},
  ];

  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    {/* Stats row + sync */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,flex:1}}>
        {stats.map(({v,c,l,s})=><Card key={l} ch={<div style={{textAlign:"center",padding:"4px 0"}}><div style={{fontSize:24,fontWeight:700,color:c}}>{v}</div><div style={{fontSize:7,color:T.dim,letterSpacing:"0.2em",marginTop:3}}>{l}</div><div style={{fontSize:9,color:T.dim,marginTop:3}}>{s}</div></div>}/>)}
      </div>
      <Btn v="ghost" onClick={doKnowledgeSync} disabled={syncing}>
        {syncing?'SYNCING...':'🔄 SYNC /knowledge/plan'}
      </Btn>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      {/* Today's Focus */}
      <Card title="TODAY'S FOCUS" right={<Badge count={todoTasks.filter(t=>["P0","P1"].includes(t.priority)).length} color={T.orange}/>} ch={
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          {todoTasks.filter(t=>["P0","P1"].includes(t.priority)).slice(0,8).map(t=>
            <div key={t.id} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 6px",borderRadius:4,background:t.status==="in_progress"?"rgba(245,158,11,0.05)":"transparent"}}>
              <Dot s={t.status}/><Tag l={t.priority} c={t.priority==="P0"?T.red:T.orange}/><span style={{flex:1,fontSize:10,color:T.text}}>{t.title}</span>
              <Tag l={t.status} c={SC[t.status]}/>
            </div>
          )}
          {!todoTasks.filter(t=>["P0","P1"].includes(t.priority)).length&&<EmptyState icon="✓" text="No high-priority tasks"/>}
        </div>
      }/>

      {/* Blockers */}
      <Card title="BLOCKERS" right={<Badge count={blockers.length} color={T.red}/>} ch={
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          {blockers.slice(0,8).map((b,i)=>
            <div key={i} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 6px",borderRadius:4,background:T.redD}}>
              <Dot s="blocked"/><span style={{flex:1,fontSize:10,color:T.text}}>{b.title}</span>
              {b._featureName&&<Tag l={b._featureName} c={T.dim}/>}
              {b.severity&&<Tag l={b.severity} c={T.red}/>}
            </div>
          )}
          {!blockers.length&&<EmptyState icon="✓" text="No blockers"/>}
        </div>
      }/>
    </div>

    {/* Route Health */}
    <Card title="ROUTE HEALTH" right={<span style={{fontSize:8,color:T.dim}}>Click to explore</span>} ch={
      <div style={{display:"flex",flexDirection:"column",gap:2}}>
        {F.map(f=>{
          const js=f.journeys||[],wj=js.filter(j=>j.status==="working").length,bj=js.filter(j=>j.bdd).length;
          const pct=js.length?Math.round(wj/js.length*100):0;
          const bddPct=js.length?Math.round(bj/js.length*100):0;
          return <div key={f.id} onClick={()=>{setView("routes");setSelPage(f.id)}} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 8px",borderRadius:4,cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background=T.hover} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <Dot s={f.status}/><span style={{flex:1,color:T.text,fontWeight:600,fontSize:10}}>{f.name}</span>
            <span style={{fontSize:8,color:T.dim,width:80}}>{f.route}</span>
            {f.lastSync&&<span style={{fontSize:8,color:T.dim}}>{f.lastSync}</span>}
            <div style={{width:60,height:3,background:T.border,borderRadius:2,position:'relative'}} title={`${wj}/${js.length} journeys working`}><div style={{width:`${pct}%`,height:3,background:pct===100?T.green:pct>60?T.yellow:T.red,borderRadius:2}}/></div>
            <span style={{fontSize:8,color:T.dim,width:30,textAlign:"right"}}>{wj}/{js.length}</span>
            <div style={{width:40,height:3,background:T.border,borderRadius:2}} title={`${bj}/${js.length} BDD specs`}><div style={{width:`${bddPct}%`,height:3,background:bddPct===100?T.green:T.yellow,borderRadius:2}}/></div>
            <span style={{fontSize:7,color:bddPct===100?T.green:T.yellow,width:25}}>{bddPct}%</span>
          </div>;
        })}
      </div>
    }/>

    {/* Recent Activity */}
    <Card title="RECENT ACTIVITY" ch={
      <div style={{display:"flex",flexDirection:"column",gap:4}}>
        {(data.workLog||[]).slice(-8).reverse().map((e,i)=>
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",fontSize:9}}>
            <span style={{color:T.dim,width:65,flexShrink:0}}>{e.date}</span>
            <Tag l={e.type||e.tags?.[0]||"log"} c={T.accent}/>
            <span style={{flex:1,color:T.text}}>{e.summary}</span>
          </div>
        )}
        {!(data.workLog||[]).length&&<EmptyState text="No activity yet. Run a sync or log work manually."/>}
      </div>
    }/>
  </div>;
}

// ═══════════════════════════════════════════════════════════════
//  ROUTE BOARD (Pages/Features)
// ═══════════════════════════════════════════════════════════════
function RouteBoardSidebar({features,selected,onSelect}){
  return <div style={{width:220,borderRight:`1px solid ${T.border}`,padding:"8px 0",overflowY:"auto",flexShrink:0}}>
    <div style={{padding:"4px 12px 8px",fontSize:7,fontWeight:700,color:T.dim,letterSpacing:"0.3em"}}>ROUTES</div>
    {features.map(f=>{
      const js=f.journeys||[],bdd=js.filter(j=>j.bdd).length,bddPct=js.length?Math.round(bdd/js.length*100):0;
      return <div key={f.id} onClick={()=>onSelect(f.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 12px",cursor:"pointer",background:selected===f.id?T.hover:"transparent",borderLeft:selected===f.id?`2px solid ${T.accent}`:"2px solid transparent"}} onMouseEnter={e=>{if(selected!==f.id)e.currentTarget.style.background=T.hover}} onMouseLeave={e=>{if(selected!==f.id)e.currentTarget.style.background="transparent"}}>
        <Dot s={f.status}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:10,color:selected===f.id?T.bright:T.text,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</div>
          <div style={{fontSize:8,color:T.dim}}>{f.route}</div>
        </div>
        {bddPct<100&&<span style={{fontSize:7,color:T.yellow}}>{bddPct}%</span>}
        <Badge count={(f.bugs||[]).filter(b=>b.status==="open").length}/>
      </div>;
    })}
  </div>;
}

function JourneysTab({feature,onUpdate,toast}){
  const [expJ,setExpJ]=useState(null);
  const [testRes,setTestRes]=useState({});
  const [editing,setEditing]=useState(null);
  const [editBdd,setEditBdd]=useState('');
  const [generating,setGenerating]=useState(null);
  const [runningAll,setRunningAll]=useState(false);
  const [bugFor,setBugFor]=useState(null);
  const [nb,setNb]=useState({title:'',severity:'P2',description:'',stepsToReproduce:''});
  const journeys=feature.journeys||[];
  const bddCount=journeys.filter(j=>j.bdd).length;

  const openBugForm=(i)=>{
    const j=journeys[i];
    setNb({title:`Bug in: ${j.name}`,severity:'P2',description:'',stepsToReproduce:j.bdd?`Journey: ${j.name}\n\n${j.bdd}`:`Journey: ${j.name}`});
    setBugFor(i);
    setExpJ(i);
  };

  const logBug=()=>{
    if(!nb.title.trim())return;
    const bug={id:`bug-${Date.now()}`,title:nb.title,severity:nb.severity,description:nb.description,stepsToReproduce:nb.stepsToReproduce,labels:[],status:'open',logged:new Date().toISOString().split('T')[0]};
    onUpdate({...feature,bugs:[...(feature.bugs||[]),bug]});
    setBugFor(null);
    setNb({title:'',severity:'P2',description:'',stepsToReproduce:''});
    toast.show('Bug logged','success');
  };

  const runTest=async(jName,idx)=>{
    setTestRes(p=>({...p,[idx]:"running"}));
    try{
      const r=await api.post("/api/test",{grep:jName});
      setTestRes(p=>({...p,[idx]:r.passed?"pass":"fail",[idx+"_out"]:r.output}));
    }catch(e){setTestRes(p=>({...p,[idx]:"fail",[idx+"_out"]:e.message}));}
  };

  const runAll=async()=>{
    setRunningAll(true);
    for(let i=0;i<journeys.length;i++){
      await runTest(journeys[i].name,i);
    }
    setRunningAll(false);
    toast.show(`Tested ${journeys.length} journeys`,'success');
  };

  const saveBdd=(idx)=>{
    const updated={...feature,journeys:feature.journeys.map((j,i)=>i===idx?{...j,bdd:editBdd||null}:j)};
    onUpdate(updated);
    setEditing(null);
    toast.show('BDD saved','success');
  };

  const genBdd=async(idx)=>{
    setGenerating(idx);
    try{
      const r=await api.post('/api/generate-bdd',{featureId:feature.id,journeyName:journeys[idx].name});
      if(r.ok&&r.result){
        const bdd=r.result.bdd||r.result.scenarios?.map(s=>s.steps).join('\n\n');
        if(bdd){setEditing(idx);setEditBdd(bdd);}
      }else{toast.show('Claude returned no BDD','error');}
    }catch(e){toast.show('BDD generation failed','error');}
    setGenerating(null);
  };

  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:9,color:T.dim}}>BDD Coverage:</span>
        <div style={{width:100,height:4,background:T.border,borderRadius:2}}><div style={{width:`${journeys.length?bddCount/journeys.length*100:0}%`,height:4,background:bddCount===journeys.length?T.green:T.yellow,borderRadius:2}}/></div>
        <span style={{fontSize:9,color:bddCount===journeys.length?T.green:T.yellow}}>{bddCount}/{journeys.length}</span>
      </div>
      <Btn v="primary" onClick={runAll} disabled={runningAll}>{runningAll?`TESTING...`:`▶ RUN ALL (${journeys.length})`}</Btn>
    </div>

    <div style={{display:"flex",flexDirection:"column",gap:3}}>
      {journeys.map((j,i)=>{
        const tr=testRes[i];
        const hasBdd=!!j.bdd;
        return <div key={i}>
          <div style={{display:"flex",alignItems:"center",gap:6,padding:"5px 6px",borderRadius:4,background:j.status==="broken"?T.redD:j.status==="missing"?"rgba(255,255,255,0.02)":"transparent"}}>
            <div onClick={()=>setExpJ(expJ===i?null:i)} style={{display:"flex",alignItems:"center",gap:6,flex:1,cursor:"pointer"}}>
              <Dot s={j.status}/>
              <span style={{flex:1,color:T.text,fontSize:10}}>{j.name}</span>
              {j.discovered&&<Tag l="discovered" c={T.violet}/>}
              {!hasBdd&&<span title="No BDD spec" style={{fontSize:10,cursor:"help"}}>⚠️</span>}
              {hasBdd&&<Tag l="BDD" c={T.green}/>}
              <Tag l={j.status} c={SC[j.status]||T.dim}/>
              {j.lastTestResult&&<Tag l={j.lastTestResult} c={SC[j.lastTestResult]}/>}
            </div>
            <button onClick={()=>genBdd(i)} disabled={generating===i} title="Generate BDD with Claude" style={{background:"none",border:`1px solid rgba(139,92,246,0.3)`,borderRadius:3,padding:"2px 6px",cursor:"pointer",color:T.violet,fontSize:8,fontFamily:"inherit",fontWeight:700}}>{generating===i?"...":"⚡"}</button>
            <button onClick={()=>runTest(j.name,i)} disabled={tr==="running"} title="Run Playwright test" style={{background:"none",border:`1px solid ${tr?SC[tr]+"44":T.border}`,borderRadius:3,padding:"2px 7px",cursor:tr==="running"?"not-allowed":"pointer",color:tr?SC[tr]:T.dim,fontSize:9,fontFamily:"inherit",fontWeight:700}}>
              {tr==="running"?"…":tr==="pass"?"✓":tr==="fail"?"✗":"▶"}
            </button>
            <button onClick={()=>bugFor===i?setBugFor(null):openBugForm(i)} title="Log bug for this journey" style={{background:bugFor===i?"rgba(239,68,68,0.15)":"none",border:`1px solid rgba(239,68,68,${bugFor===i?"0.5":"0.25"})`,borderRadius:3,padding:"2px 6px",cursor:"pointer",color:T.red,fontSize:8,fontFamily:"inherit",fontWeight:700}}>🐛</button>
          </div>
          {expJ===i&&<div style={{margin:"3px 0 2px 18px",display:"flex",flexDirection:"column",gap:4}}>
            {bugFor===i&&<div style={{padding:"8px 10px",background:"rgba(239,68,68,0.05)",borderRadius:4,border:`1px solid rgba(239,68,68,0.2)`}}>
              <div style={{fontSize:9,fontWeight:700,color:T.red,marginBottom:6}}>🐛 LOG BUG — {j.name}</div>
              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                <Input value={nb.title} onChange={v=>setNb(p=>({...p,title:v}))} placeholder="Bug title"/>
                <Select value={nb.severity} onChange={v=>setNb(p=>({...p,severity:v}))} options={[{value:'P0',label:'P0 — Critical'},{value:'P1',label:'P1 — High'},{value:'P2',label:'P2 — Medium'},{value:'P3',label:'P3 — Low'}]}/>
                <TextArea value={nb.description} onChange={v=>setNb(p=>({...p,description:v}))} placeholder="Description" rows={2}/>
                <TextArea value={nb.stepsToReproduce} onChange={v=>setNb(p=>({...p,stepsToReproduce:v}))} placeholder="Steps to reproduce" rows={2}/>
                <div style={{display:"flex",gap:4,justifyContent:"flex-end"}}><Btn v="ghost" onClick={()=>setBugFor(null)}>Cancel</Btn><Btn v="primary" sx={{background:T.red,borderColor:T.red}} onClick={logBug}>Log Bug</Btn></div>
              </div>
            </div>}
            {bugFor!==i&&<div>
              {editing===i?<div>
                <TextArea value={editBdd} onChange={setEditBdd} placeholder="Given ...\nWhen ...\nThen ..." rows={4}/>
                <div style={{display:"flex",gap:4,marginTop:4}}><Btn v="primary" onClick={()=>saveBdd(i)}>Save</Btn><Btn v="ghost" onClick={()=>setEditing(null)}>Cancel</Btn></div>
              </div>:<div>
                <div onClick={()=>{setEditing(i);setEditBdd(j.bdd||'')}} style={{padding:"8px 10px",background:T.bg,borderRadius:4,border:`1px solid ${T.border}`,fontSize:9,color:j.bdd?T.text:T.dim,lineHeight:1.7,whiteSpace:"pre-wrap",cursor:"pointer"}} title="Click to edit">{j.bdd||"No BDD steps yet. Click to add, or ⚡ to generate."}</div>
                {j.syncNote&&<div style={{padding:"5px 10px",background:"rgba(59,130,246,0.05)",borderRadius:4,border:`1px solid rgba(59,130,246,0.12)`,fontSize:8,color:T.text,lineHeight:1.5,marginTop:2}}><span style={{color:T.accent,fontWeight:700}}>CLAUDE </span>{j.syncNote}</div>}
              </div>}
              {tr&&tr!=="running"&&testRes[i+"_out"]&&<div style={{padding:"6px 10px",background:tr==="pass"?"rgba(16,185,129,0.05)":"rgba(239,68,68,0.05)",borderRadius:4,border:`1px solid ${SC[tr]}22`,fontSize:8,color:SC[tr],lineHeight:1.5,whiteSpace:"pre-wrap",maxHeight:120,overflow:"auto"}}>{testRes[i+"_out"].slice(-600)}</div>}
            </div>}
          </div>}
        </div>;
      })}
      {!journeys.length&&<EmptyState text="No journeys. Sync with Claude to discover them."/>}
    </div>
  </div>;
}

function BugsTab({feature,onUpdate,toast}){
  const [showAdd,setShowAdd]=useState(false);
  const [nb,setNb]=useState({title:'',severity:'P2',description:'',stepsToReproduce:'',labels:''});
  const bugs=feature.bugs||[];

  const add=()=>{
    if(!nb.title.trim())return;
    const bug={id:`bug-${Date.now()}`,title:nb.title,severity:nb.severity,description:nb.description,stepsToReproduce:nb.stepsToReproduce,labels:nb.labels.split(',').map(s=>s.trim()).filter(Boolean),status:'open',logged:new Date().toISOString().split('T')[0]};
    onUpdate({...feature,bugs:[...bugs,bug]});
    setNb({title:'',severity:'P2',description:'',stepsToReproduce:'',labels:''});
    setShowAdd(false);
    toast.show('Bug logged','success');
  };

  const close=id=>{onUpdate({...feature,bugs:bugs.map(b=>b.id===id?{...b,status:'closed'}:b)});toast.show('Bug closed','success');};
  const remove=id=>{onUpdate({...feature,bugs:bugs.filter(b=>b.id!==id)});};

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
      <span style={{fontSize:9,color:T.dim}}>{bugs.filter(b=>b.status==='open').length} open</span>
      <Btn onClick={()=>setShowAdd(true)}>+ ADD BUG</Btn>
    </div>
    {bugs.map(b=><Card key={b.id} style={{marginBottom:6,opacity:b.status==='closed'?0.5:1}} ch={
      <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
        <Dot s={b.status==='open'?'broken':'done'} sz={8}/>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3}}>
            <Tag l={b.severity} c={["P0","P1"].includes(b.severity)?T.red:T.yellow}/>
            <span style={{fontSize:10,fontWeight:700,color:T.bright}}>{b.title}</span>
            {(b.labels||[]).map(l=><Tag key={l} l={l} c={T.dim}/>)}
          </div>
          {b.description&&<div style={{fontSize:9,color:T.text,lineHeight:1.5,marginBottom:3}}>{b.description}</div>}
          {b.stepsToReproduce&&<div style={{fontSize:8,color:T.dim,lineHeight:1.5}}><span style={{fontWeight:700}}>Steps: </span>{b.stepsToReproduce}</div>}
          <div style={{fontSize:8,color:T.dim,marginTop:3}}>Logged {b.logged}</div>
        </div>
        <div style={{display:"flex",gap:4}}>
          {b.status==='open'&&<Btn v="ghost" sx={{padding:"2px 6px",fontSize:8}} onClick={()=>close(b.id)}>Close</Btn>}
          <button onClick={()=>remove(b.id)} style={{background:"none",border:"none",color:T.dim,cursor:"pointer",fontSize:14}}>✕</button>
        </div>
      </div>
    }/>)}
    {showAdd&&<Card title="NEW BUG" style={{marginTop:8}} ch={<div style={{display:"flex",flexDirection:"column",gap:5}}>
      <Input value={nb.title} onChange={v=>setNb(p=>({...p,title:v}))} placeholder="Bug title"/>
      <Select value={nb.severity} onChange={v=>setNb(p=>({...p,severity:v}))} options={[{value:'P0',label:'P0 — Critical'},{value:'P1',label:'P1 — High'},{value:'P2',label:'P2 — Medium'},{value:'P3',label:'P3 — Low'}]}/>
      <TextArea value={nb.description} onChange={v=>setNb(p=>({...p,description:v}))} placeholder="Description" rows={2}/>
      <TextArea value={nb.stepsToReproduce} onChange={v=>setNb(p=>({...p,stepsToReproduce:v}))} placeholder="Steps to reproduce" rows={2}/>
      <Input value={nb.labels} onChange={v=>setNb(p=>({...p,labels:v}))} placeholder="Labels (comma separated)"/>
      <div style={{display:"flex",gap:4,justifyContent:"flex-end"}}><Btn v="ghost" onClick={()=>setShowAdd(false)}>Cancel</Btn><Btn v="primary" onClick={add}>Log Bug</Btn></div>
    </div>}/>}
    {!bugs.length&&!showAdd&&<EmptyState icon="🐛" text="No bugs. That's good!"/>}
  </div>;
}

function RequestsTab({feature,onUpdate,tasks,saveTasks,toast}){
  const [showAdd,setShowAdd]=useState(false);
  const [nr,setNr]=useState({title:'',desc:'',why:'',ac:'',priority:'P2',bdd:'',images:[]});
  const [uploading,setUploading]=useState(false);
  const fileRef=useRef(null);
  const requests=feature.requests||[];

  const handleImageUpload=async(e)=>{
    const files=Array.from(e.target.files);
    if(!files.length)return;
    setUploading(true);
    for(const file of files){
      await new Promise(resolve=>{
        const reader=new FileReader();
        reader.onload=async(ev)=>{
          const result=await api.post('/api/upload',{filename:file.name,data:ev.target.result});
          if(result.ok)setNr(p=>({...p,images:[...p.images,{path:result.path,caption:file.name}]}));
          resolve();
        };
        reader.readAsDataURL(file);
      });
    }
    setUploading(false);
    e.target.value='';
  };

  const add=()=>{
    if(!nr.title.trim())return;
    onUpdate({...feature,requests:[...requests,{id:`req-${Date.now()}`,title:nr.title,desc:nr.desc,spec:{what:nr.title,why:nr.why,ac:nr.ac},bdd:nr.bdd||null,status:'draft',logged:new Date().toISOString().split('T')[0],priority:nr.priority,images:nr.images}]});
    setNr({title:'',desc:'',why:'',ac:'',priority:'P2',bdd:'',images:[]});
    setShowAdd(false);
    toast.show('Request added','success');
  };

  const approve=id=>onUpdate({...feature,requests:requests.map(r=>r.id===id?{...r,status:'proposed'}:r)});

  const convertToTask=(r)=>{
    if(!r.bdd){toast.show('Add BDD spec before converting to task','error');return;}
    const task={id:`T-${Date.now()}`,title:r.title,brief:r.desc,bdd:r.bdd,priority:r.priority,status:'todo',featureId:feature.id,tags:[],subtasks:[]};
    saveTasks([...tasks,task]);
    onUpdate({...feature,requests:requests.map(x=>x.id===r.id?{...x,status:'converted',convertedToTaskId:task.id}:x)});
    toast.show('Converted to task','success');
  };

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
      <span style={{fontSize:9,color:T.dim}}>{requests.filter(r=>r.status!=='converted').length} active</span>
      <Btn onClick={()=>setShowAdd(true)}>+ ADD REQUEST</Btn>
    </div>
    {requests.map(r=>{
      const isDraft=r.status==='draft';
      return <Card key={r.id} style={{marginBottom:6,opacity:r.status==='converted'?0.5:1}} ch={
        <div>
          <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:4}}>
            <Tag l={r.status} c={SC[r.status]||T.dim}/><Tag l={r.priority} c={["P0","P1"].includes(r.priority)?T.red:T.yellow}/>
            <span style={{fontSize:10,fontWeight:600,color:T.bright,flex:1}}>{r.title}</span>
            {!r.bdd&&<span title="Needs BDD to convert">⚠️</span>}
            {isDraft&&<Btn v="ghost" sx={{padding:"2px 6px",fontSize:8}} onClick={()=>approve(r.id)}>Approve</Btn>}
            {r.status==='proposed'&&<Btn v="primary" sx={{padding:"2px 6px",fontSize:8}} onClick={()=>convertToTask(r)}>→ Task</Btn>}
          </div>
          {r.desc&&<div style={{fontSize:9,color:T.dim,marginBottom:3}}>{r.desc}</div>}
          {r.spec?.why&&<div style={{fontSize:8,color:T.text}}><span style={{color:T.dim}}>WHY: </span>{r.spec.why}</div>}
          {r.spec?.ac&&<div style={{fontSize:8,color:T.text,whiteSpace:"pre-wrap"}}><span style={{color:T.dim}}>AC: </span>{r.spec.ac}</div>}
          {r.bdd&&<div style={{fontSize:8,color:T.green,marginTop:3,whiteSpace:"pre-wrap"}}><span style={{fontWeight:700}}>BDD: </span>{r.bdd}</div>}
          {r.images?.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:6}}>{r.images.map((img,i)=><a key={i} href={img.path} target="_blank" title={img.caption}><img src={img.path} style={{width:56,height:56,objectFit:"cover",borderRadius:4,border:`1px solid ${T.border}`,cursor:"pointer",display:"block"}}/></a>)}</div>}
        </div>
      }/>;
    })}
    {showAdd&&<Card title="NEW REQUEST" style={{marginTop:8}} ch={<div style={{display:"flex",flexDirection:"column",gap:5}}>
      <Input value={nr.title} onChange={v=>setNr(p=>({...p,title:v}))} placeholder="What to build?"/>
      <TextArea value={nr.why} onChange={v=>setNr(p=>({...p,why:v}))} placeholder="Why is this needed?" rows={2}/>
      <TextArea value={nr.ac} onChange={v=>setNr(p=>({...p,ac:v}))} placeholder="Acceptance criteria" rows={2}/>
      <TextArea value={nr.bdd} onChange={v=>setNr(p=>({...p,bdd:v}))} placeholder="Given...\nWhen...\nThen... (optional now, required for task conversion)" rows={3}/>
      <Select value={nr.priority} onChange={v=>setNr(p=>({...p,priority:v}))} options={[{value:'P0',label:'P0'},{value:'P1',label:'P1'},{value:'P2',label:'P2'},{value:'P3',label:'P3'}]}/>
      <TextArea value={nr.desc} onChange={v=>setNr(p=>({...p,desc:v}))} placeholder="Additional notes" rows={2}/>
      <div>
        <input ref={fileRef} type="file" accept="image/*" multiple onChange={handleImageUpload} style={{display:"none"}}/>
        <Btn v="ghost" onClick={()=>fileRef.current?.click()} disabled={uploading}>{uploading?'Uploading...':'+ Add Images'}</Btn>
        {nr.images.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:6}}>{nr.images.map((img,i)=><div key={i} style={{position:"relative"}}><img src={img.path} style={{width:56,height:56,objectFit:"cover",borderRadius:4,border:`1px solid ${T.border}`,display:"block"}}/><button onClick={()=>setNr(p=>({...p,images:p.images.filter((_,j)=>j!==i)}))} style={{position:"absolute",top:-5,right:-5,background:T.red,border:"none",borderRadius:"50%",width:14,height:14,color:"#fff",cursor:"pointer",fontSize:9,lineHeight:"14px",textAlign:"center",padding:0}}>✕</button></div>)}</div>}
      </div>
      <div style={{display:"flex",gap:4,justifyContent:"flex-end"}}><Btn v="ghost" onClick={()=>setShowAdd(false)}>Cancel</Btn><Btn v="primary" onClick={add}>Save</Btn></div>
    </div>}/>}
    {!requests.length&&!showAdd&&<EmptyState icon="💡" text="No feature requests"/>}
  </div>;
}

function TasksTab({feature,tasks,saveTasks,toast}){
  const myTasks=tasks.filter(t=>t.featureId===feature.id);
  const [showAdd,setShowAdd]=useState(false);
  const [nt,setNt]=useState({title:'',brief:'',priority:'P1',bdd:''});

  const add=()=>{
    if(!nt.title.trim())return;
    saveTasks([...tasks,{id:`T-${Date.now()}`,status:'todo',...nt,featureId:feature.id,tags:[],subtasks:[]}]);
    setNt({title:'',brief:'',priority:'P1',bdd:''});
    setShowAdd(false);
    toast.show('Task added','success');
  };

  const cycle=id=>{const nx={todo:'in_progress',in_progress:'done',done:'todo',blocked:'todo'};saveTasks(tasks.map(t=>t.id===id?{...t,status:nx[t.status]||'todo'}:t));};
  const remove=id=>saveTasks(tasks.filter(t=>t.id!==id));

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
      <span style={{fontSize:9,color:T.dim}}>{myTasks.filter(t=>t.status!=='done').length} active</span>
      <Btn onClick={()=>setShowAdd(true)}>+ ADD TASK</Btn>
    </div>
    {myTasks.map(t=><Card key={t.id} style={{marginBottom:6}} ch={
      <div style={{display:"flex",alignItems:"flex-start",gap:6}}>
        <button onClick={()=>cycle(t.id)} style={{background:"none",border:"none",cursor:"pointer",padding:0,marginTop:2}}><Dot s={t.status} sz={8}/></button>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:2}}>
            <Tag l={t.priority} c={t.priority==="P0"?T.red:T.orange}/><Tag l={t.status} c={SC[t.status]||T.dim}/>
            <span style={{fontSize:10,fontWeight:700,color:t.status==='done'?T.dim:T.bright,textDecoration:t.status==='done'?'line-through':'none'}}>{t.title}</span>
          </div>
          {t.brief&&<div style={{fontSize:9,color:T.text,lineHeight:1.5}}>{t.brief}</div>}
          {t.bdd&&<div style={{fontSize:8,color:T.green,marginTop:2,whiteSpace:"pre-wrap"}}>{t.bdd}</div>}
        </div>
        <button onClick={()=>remove(t.id)} style={{background:"none",border:"none",color:T.dim,cursor:"pointer",fontSize:14}}>✕</button>
      </div>
    }/>)}
    {showAdd&&<Card title="NEW TASK" style={{marginTop:8}} ch={<div style={{display:"flex",flexDirection:"column",gap:5}}>
      <Input value={nt.title} onChange={v=>setNt(p=>({...p,title:v}))} placeholder="Task title"/>
      <TextArea value={nt.brief} onChange={v=>setNt(p=>({...p,brief:v}))} placeholder="Description" rows={2}/>
      <TextArea value={nt.bdd} onChange={v=>setNt(p=>({...p,bdd:v}))} placeholder="Given/When/Then (optional)" rows={2}/>
      <Select value={nt.priority} onChange={v=>setNt(p=>({...p,priority:v}))} options={[{value:'P0',label:'P0'},{value:'P1',label:'P1'},{value:'P2',label:'P2'}]}/>
      <div style={{display:"flex",gap:4,justifyContent:"flex-end"}}><Btn v="ghost" onClick={()=>setShowAdd(false)}>Cancel</Btn><Btn v="primary" onClick={add}>Add</Btn></div>
    </div>}/>}
    {!myTasks.length&&!showAdd&&<EmptyState icon="✅" text="No tasks for this route"/>}
  </div>;
}

function RouteDetail({feature,onUpdate,onSync,syncing,syncOutput,syncOutputId,tasks,saveTasks,workLog,toast}){
  const [tab,setTab]=useState('journeys');
  const tabs=[
    {id:'journeys',label:'Journeys',badge:(feature.journeys||[]).length},
    {id:'bugs',label:'Bugs',badge:(feature.bugs||[]).filter(b=>b.status==='open').length,badgeColor:T.red},
    {id:'requests',label:'Requests',badge:(feature.requests||[]).filter(r=>r.status!=='converted').length},
    {id:'tasks',label:'Tasks',badge:tasks.filter(t=>t.featureId===feature.id&&t.status!=='done').length},
    {id:'notes',label:'Notes',badge:(feature.notes||[]).length},
    {id:'activity',label:'Activity'},
  ];

  return <div>
    {/* Status bar */}
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
      <Dot s={feature.status} sz={10}/>
      <span style={{fontSize:14,fontWeight:700,color:T.bright}}>{feature.name}</span>
      <span style={{fontSize:9,color:T.dim}}>{feature.route}</span>
      <span style={{fontSize:9,color:T.dim}}>· {feature.component}</span>
      <span style={{flex:1}}/>
      {feature.lastSync&&<span style={{fontSize:8,color:T.dim}}>synced {feature.lastSync}</span>}
      <Btn v="sync" onClick={()=>onSync(feature.id)} disabled={syncing===feature.id}>
        {syncing===feature.id?"READING...":"⚡ SYNC CLAUDE"}
      </Btn>
    </div>

    {feature.syncNote&&!syncOutput&&<div style={{padding:"7px 12px",background:"rgba(59,130,246,0.05)",border:`1px solid rgba(59,130,246,0.15)`,borderRadius:4,fontSize:9,color:T.text,marginBottom:10,lineHeight:1.6}}>
      <span style={{color:T.accent,fontWeight:700}}>CLAUDE </span>{feature.syncNote}
    </div>}
    {syncOutput&&<SyncTerminal output={syncOutput} running={syncing===feature.id}/>}

    {/* Components & API summary */}
    <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
      {(feature.components||[]).slice(0,8).map(c=><span key={c} style={{fontSize:8,padding:"2px 5px",background:T.surface,border:`1px solid ${T.border}`,borderRadius:3,color:T.text}}>{c}</span>)}
      {(feature.apiCalls||[]).map((a,i)=><span key={i} style={{fontSize:8,color:T.accent,padding:"2px 5px",background:T.accentD,borderRadius:3}}>{a}</span>)}
      {(feature.lambdas||[]).map((l,i)=><span key={i} style={{fontSize:8,color:T.violet,padding:"2px 5px",background:T.violetD,borderRadius:3}}>λ {l}</span>)}
    </div>

    {/* Tabs */}
    <div className="tab-bar">
      {tabs.map(t=><button key={t.id} className={`tab-btn ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>
        {t.label} {t.badge?<Badge count={t.badge} color={t.badgeColor||T.accent}/>:null}
      </button>)}
    </div>

    {tab==='journeys'&&<JourneysTab feature={feature} onUpdate={onUpdate} toast={toast}/>}
    {tab==='bugs'&&<BugsTab feature={feature} onUpdate={onUpdate} toast={toast}/>}
    {tab==='requests'&&<RequestsTab feature={feature} onUpdate={onUpdate} tasks={tasks} saveTasks={saveTasks} toast={toast}/>}
    {tab==='tasks'&&<TasksTab feature={feature} tasks={tasks} saveTasks={saveTasks} toast={toast}/>}
    {tab==='notes'&&<NotesTab feature={feature} onUpdate={onUpdate} toast={toast}/>}
    {tab==='activity'&&<ActivityTab feature={feature} workLog={workLog}/>}
  </div>;
}

function RoutesView({data,selPage,setSelPage,onUpdateFeature,onSync,syncing,syncOutput,syncOutputId,tasks,saveTasks,toast}){
  const F=data.features||[];
  const sel=selPage?F.find(x=>x.id===selPage):null;

  return <div style={{display:"flex",height:"calc(100vh - 55px)"}}>

}

//  LAMBDA DETAIL
// ═══════════════════════════════════════════════════════════════
function LambdaDetail({l,onBack,onDocument,documenting,toast,onReload}){
  const [source,setSource]=useState(null);
  const [showSource,setShowSource]=useState(false);
  const [editBdd,setEditBdd]=useState(null);
  const [testRes,setTestRes]=useState(null);

  const loadSource=async()=>{
    const r=await api.post('/api/lambda-source',{name:l.name});
    if(r.ok)setSource(r.files);
    setShowSource(true);
  };

  const saveBdd=async(bdd)=>{
    // Update lambda BDD via features endpoint (lambdas are top-level)
    const r=await api.get('/api/data');
    const pmData=r;
    const lambda=pmData.lambdas.find(x=>x.name===l.name);
    if(lambda){lambda.bdd=bdd;}
    await api.post('/api/features',{features:pmData.features}); // hack: save via data reload
    // Actually we need a lambda update endpoint... let's use tasks endpoint pattern
    await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tasks:pmData.tasks})});
    setEditBdd(null);
    toast.show('BDD saved','success');
    onReload();
  };

  const runTest=async()=>{
    setTestRes('running');
    try{
      const r=await api.post('/api/test',{grep:l.name});
      setTestRes(r.passed?'pass':'fail');
    }catch{setTestRes('fail');}
  };

  const genBdd=async()=>{
    toast.show('Generating BDD...','info');
    const r=await api.post('/api/generate-bdd',{lambdaName:l.name});
    if(r.ok&&r.result){
      const bdd=r.result.bdd||r.result.scenarios?.map(s=>`## ${s.name}\n${s.steps}`).join('\n\n');
      if(bdd){setEditBdd(bdd);}
    }else{toast.show('Failed to generate BDD','error');}
  };

  return <div>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
      <button onClick={onBack} style={{background:"none",border:"none",color:T.accent,cursor:"pointer",fontSize:10,fontFamily:"inherit"}}>← LAMBDAS</button>
      <span style={{color:T.dim}}>/</span>
      <span style={{color:T.bright,fontSize:14,fontWeight:700}}>{l.name}</span>
      <Tag l={l.status} c={SC[l.status]||T.dim}/>
      {l.category&&<Tag l={l.category} c={T.violet}/>}
      <span style={{flex:1}}/>
      <Btn v="sync" onClick={()=>onDocument(l.name)} disabled={documenting===l.name}>
        {documenting===l.name?"ANALYZING...":"⚡ RE-ANALYZE"}
      </Btn>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      {/* Left column */}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {/* Description */}
        <Card title="OVERVIEW" ch={<div>
          <div style={{fontSize:11,color:T.text,lineHeight:1.8,marginBottom:8}}>{l.docs?.description||l.desc||"No documentation yet. Click ⚡ to analyze."}</div>
          {l.docs?.trigger&&<div style={{display:"flex",gap:6,alignItems:"center"}}><span style={{fontSize:7,color:T.dim,letterSpacing:"0.15em"}}>TRIGGER</span><Tag l={l.docs.trigger} c={T.accent}/></div>}
          {l.docsUpdated&&<div style={{fontSize:7,color:T.dim,marginTop:6}}>Last analyzed: {l.docsUpdated}</div>}
        </div>}/>

        {/* BDD Specs */}
        <Card title="BDD SPECS" right={<div style={{display:"flex",gap:4}}>
          <Btn v="sync" sx={{padding:"2px 6px",fontSize:8}} onClick={genBdd}>⚡ GENERATE</Btn>
          <Btn sx={{padding:"2px 6px",fontSize:8}} onClick={runTest} disabled={testRes==='running'}>
            {testRes==='running'?'...':testRes==='pass'?'✓ PASS':testRes==='fail'?'✗ FAIL':'▶ RUN'}
          </Btn>
        </div>} ch={
          editBdd!==null?<div>
            <TextArea value={editBdd} onChange={setEditBdd} rows={6} placeholder="Given...\nWhen...\nThen..."/>
            <div style={{display:"flex",gap:4,marginTop:4}}><Btn v="primary" onClick={()=>saveBdd(editBdd)}>Save</Btn><Btn v="ghost" onClick={()=>setEditBdd(null)}>Cancel</Btn></div>
          </div>:
          <div onClick={()=>setEditBdd(l.bdd||'')} style={{cursor:"pointer",fontSize:9,color:l.bdd?T.text:T.dim,lineHeight:1.7,whiteSpace:"pre-wrap",padding:"4px 0"}}>
            {l.bdd||"No BDD specs. Click to add or ⚡ to generate."}
          </div>
        }/>

        {/* Inputs / Outputs */}
        {l.docs?.inputs?.length>0&&<Card title="INPUTS" ch={<div style={{display:"flex",flexDirection:"column",gap:4}}>
          {l.docs.inputs.map((inp,i)=><div key={i} style={{padding:"5px 8px",background:T.surface,borderRadius:4,border:`1px solid ${T.border}`}}>
            <span style={{fontSize:10,fontWeight:700,color:T.accent}}>{inp.name}</span> <span style={{fontSize:8,color:T.dim,padding:"1px 4px",background:T.accentD,borderRadius:2}}>{inp.type}</span>
            <div style={{fontSize:8,color:T.text,marginTop:2}}>{inp.desc}</div>
          </div>)}
        </div>}/>}
        {l.docs?.outputs?.length>0&&<Card title="OUTPUTS" ch={<div style={{display:"flex",flexDirection:"column",gap:4}}>
          {l.docs.outputs.map((out,i)=><div key={i} style={{padding:"5px 8px",background:T.surface,borderRadius:4,border:`1px solid ${T.border}`}}>
            <span style={{fontSize:10,fontWeight:700,color:T.green}}>{out.name}</span> <span style={{fontSize:8,color:T.dim,padding:"1px 4px",background:"rgba(16,185,129,0.1)",borderRadius:2}}>{out.type}</span>
            <div style={{fontSize:8,color:T.text,marginTop:2}}>{out.desc}</div>
          </div>)}
        </div>}/>}
      </div>

      {/* Right column */}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {/* Flow Diagram */}
        {l.docs?.flow&&<Card title="CODE FLOW" ch={
          <div style={{background:T.bg,borderRadius:4,padding:"12px 8px",minHeight:80}}>
            <MermaidChart chart={l.docs.flow} id={l.name}/>
          </div>
        }/>}

        {/* Dependencies */}
        {l.docs?.dependencies?.length>0&&<Card title="DEPENDENCIES" ch={
          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
            {l.docs.dependencies.map((d,i)=><span key={i} style={{fontSize:9,padding:"4px 8px",background:T.violetD,border:`1px solid rgba(139,92,246,0.2)`,borderRadius:4,color:T.violet}}>{d}</span>)}
          </div>
        }/>}

        {/* Error Handling */}
        {(l.docs?.errorHandling||l.errorHandling||[]).length>0&&<Card title="ERROR HANDLING" ch={
          <div style={{display:"flex",flexDirection:"column",gap:3}}>
            {(l.docs?.errorHandling||l.errorHandling||[]).map((e,i)=><div key={i} style={{display:"flex",gap:6,padding:"4px 6px",fontSize:9}}>
              <span style={{color:T.red,fontWeight:700,flexShrink:0}}>{e.code}</span>
              <span style={{color:T.text}}>{e.description}</span>
            </div>)}
          </div>
        }/>}

        {/* Security */}
        {(l.docs?.security||l.security)&&<Card title="SECURITY" ch={
          <div style={{fontSize:9,color:T.text,lineHeight:1.6}}>{l.docs?.security||l.security}</div>
        }/>}

        {/* Notes */}
        {l.docs?.notes&&<div style={{padding:"7px 10px",background:"rgba(245,158,11,0.05)",borderRadius:4,border:`1px solid rgba(245,158,11,0.15)`,fontSize:9,color:T.yellow,lineHeight:1.6}}>⚠ {l.docs.notes}</div>}

        {/* Source Preview */}
        <Card title="SOURCE" right={<Btn v="ghost" sx={{padding:"2px 6px",fontSize:8}} onClick={loadSource}>{showSource?"REFRESH":"VIEW SOURCE"}</Btn>} ch={
          showSource&&source?<div style={{maxHeight:300,overflowY:"auto"}}>
            {Object.entries(source).map(([fname,code])=><details key={fname}>
              <summary style={{fontSize:9,color:T.accent,padding:"4px 0",borderBottom:`1px solid ${T.border}`}}>{fname} ({code.length} chars)</summary>
              <pre style={{fontSize:8,color:T.text,background:T.bg,padding:8,whiteSpace:"pre-wrap",lineHeight:1.5,maxHeight:200,overflow:"auto"}}>{code}</pre>
            </details>)}
          </div>:<div style={{fontSize:9,color:T.dim}}>Click "View Source" to load handler.ts, types.ts, resource.ts</div>
        }/>
      </div>
    </div>
  </div>;
}

function LambdasView({data,onReload,toast}){
  const lambdas=data.lambdas||[];
  const [sel,setSel]=useState(null);
  const [documenting,setDocumenting]=useState(null);

  const doDocument=async(name)=>{
    setDocumenting(name||"all");
    try{
      const r=await api.post("/api/lambda-docs",name?{name}:{});
      if(r.ok){toast.show(name?`${name} documented`:`${r.count} lambdas documented`,'success');await onReload();}
      else toast.show("Error: "+r.error,'error');
    }catch(e){toast.show("Failed: "+e.message,'error');}
    setDocumenting(null);
  };

  const selLambda=sel?lambdas.find(l=>l.name===sel):null;
  if(selLambda)return <LambdaDetail l={selLambda} onBack={()=>setSel(null)} onDocument={doDocument} documenting={documenting} toast={toast} onReload={onReload}/>;

  const cats=[...new Set(lambdas.map(l=>l.category))];

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <span style={{fontSize:8,fontWeight:700,color:T.dim,letterSpacing:"0.3em"}}>LAMBDA FUNCTIONS</span>
        <span style={{fontSize:9,color:T.dim}}>{lambdas.filter(l=>l.bdd).length}/{lambdas.length} with BDD</span>
      </div>
      <Btn v="sync" onClick={()=>doDocument(null)} disabled={!!documenting}>
        {documenting==="all"?"DOCUMENTING...":"⚡ DOCUMENT ALL"}
      </Btn>
    </div>
    {cats.map(cat=>{const items=lambdas.filter(l=>l.category===cat);
      return <div key={cat} style={{marginBottom:16}}>
        <div style={{fontSize:8,fontWeight:700,color:T.dim,letterSpacing:"0.25em",textTransform:"uppercase",marginBottom:6}}>{cat}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
          {items.map(l=><div key={l.name} onClick={()=>setSel(l.name)} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",background:T.glass,borderRadius:6,border:`1px solid ${T.border}`,cursor:"pointer",transition:"border-color 0.15s"}} onMouseEnter={e=>e.currentTarget.style.borderColor=T.borderA} onMouseLeave={e=>e.currentTarget.style.borderColor=T.border}>
            <Dot s={l.status}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:10,fontWeight:700,color:T.bright}}>{l.name}</div>
              <div style={{fontSize:8,color:T.dim,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.docs?.description||l.desc}</div>
            </div>
            <div style={{display:"flex",gap:3,alignItems:"center",flexShrink:0}}>
              {l.bdd&&<Tag l="BDD" c={T.green}/>}
              {l.docs&&<span style={{fontSize:7,color:T.green,padding:"1px 4px",background:"rgba(16,185,129,0.1)",borderRadius:2}}>DOCS</span>}
              <Tag l={l.status} c={SC[l.status]||T.dim}/>
            </div>
          </div>)}
        </div>
      </div>;
    })}
  </div>;
}

function EntityDetail({entity,entities,features,lambdas}){
  const rels=entity.relationships||[];
  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
    <Card title="FIELDS" ch={
      <div style={{display:"flex",flexDirection:"column",gap:2}}>
        {(entity.fields||[]).map((f,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,padding:"3px 6px",borderRadius:3,background:i%2===0?T.surface:"transparent"}}>
          <span style={{fontSize:10,fontWeight:700,color:f.required?T.bright:T.text,flex:1}}>{f.name}{f.required&&<span style={{color:T.red}}>*</span>}</span>
          <span style={{fontSize:8,color:T.accent,padding:"1px 5px",background:T.accentD,borderRadius:2}}>{f.type}</span>
          {f.default!==null&&f.default!==undefined&&<span style={{fontSize:7,color:T.dim}}>={String(f.default)}</span>}
        </div>)}
      </div>
    }/>
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <Card title="RELATIONSHIPS" ch={
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          {rels.map((r,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 6px"}}>
            <Tag l={r.type} c={r.type==='hasMany'?T.accent:r.type==='belongsTo'?T.violet:T.green}/>
            <span style={{fontSize:10,color:T.bright,fontWeight:700}}>{r.target}</span>
            <span style={{fontSize:8,color:T.dim}}>via {r.field}</span>
          </div>)}
          {!rels.length&&<span style={{fontSize:9,color:T.dim}}>No relationships</span>}
        </div>
      }/>
      <Card title="AUTH RULES" ch={
        <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
          {(entity.auth||[]).map((a,i)=><Tag key={i} l={a} c={a.includes('owner')?T.green:a.includes('public')?T.yellow:T.violet}/>)}
        </div>
      }/>
      <Card title="USED BY" ch={
        <div>
          {(entity.usedByRoutes||[]).length>0&&<div style={{marginBottom:6}}><div style={{fontSize:7,color:T.dim,letterSpacing:"0.15em",marginBottom:3}}>ROUTES</div>{entity.usedByRoutes.map(r=>{const f=features.find(x=>x.id===r);return <Tag key={r} l={f?.name||r} c={T.accent}/>})}</div>}
          {(entity.usedByLambdas||[]).length>0&&<div><div style={{fontSize:7,color:T.dim,letterSpacing:"0.15em",marginBottom:3}}>LAMBDAS</div>{entity.usedByLambdas.map(l=><Tag key={l} l={l} c={T.violet}/>)}</div>}
          {!(entity.usedByRoutes||[]).length&&!(entity.usedByLambdas||[]).length&&<span style={{fontSize:9,color:T.dim}}>Cross-references populated after schema sync</span>}
        </div>
      }/>
    </div>
  </div>;
}

function DataView({data,onReload,toast}){
  const entities=data.entities||[];
  const [sel,setSel]=useState(null);
  const [syncing,setSyncing]=useState(false);
  const [showDiagram,setShowDiagram]=useState(true);

  const syncSchema=async()=>{
    setSyncing(true);
    toast.show('Parsing Amplify schema with Claude...','info');
    try{
      const r=await api.post('/api/schema-sync',{});
      if(r.ok){toast.show(`Synced ${r.entityCount} entities`,'success');await onReload();}
      else toast.show('Error: '+r.error,'error');
    }catch(e){toast.show('Failed: '+e.message,'error');}
    setSyncing(false);
  };

  const selEntity=sel?entities.find(e=>e.name===sel):null;

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <span style={{fontSize:8,fontWeight:700,color:T.dim,letterSpacing:"0.3em"}}>DATA ENTITIES</span>
        <span style={{fontSize:9,color:T.dim}}>{entities.length} models</span>
      </div>
      <div style={{display:"flex",gap:6}}>
        <Btn v="ghost" onClick={()=>setShowDiagram(!showDiagram)}>{showDiagram?"HIDE":"SHOW"} ER DIAGRAM</Btn>
        <Btn v="sync" onClick={syncSchema} disabled={syncing}>{syncing?"SYNCING...":"⚡ SCHEMA SYNC"}</Btn>
      </div>
    </div>

    {!entities.length&&<Card ch={<EmptyState icon="◆" text='No entities yet. Click "⚡ SCHEMA SYNC" to parse your Amplify schema.'/>}/>}

    {showDiagram&&data.entityDiagram&&<Card title="ENTITY RELATIONSHIP DIAGRAM" style={{marginBottom:12}} ch={
      <div style={{background:T.bg,borderRadius:4,padding:"12px 8px",minHeight:100,overflowX:"auto"}}>
        <MermaidChart chart={data.entityDiagram} id="er-diagram"/>
      </div>
    }/>}

    {selEntity&&<div style={{marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
        <button onClick={()=>setSel(null)} style={{background:"none",border:"none",color:T.accent,cursor:"pointer",fontSize:10,fontFamily:"inherit"}}>← ALL ENTITIES</button>
        <span style={{color:T.dim}}>/</span>
        <span style={{fontSize:14,fontWeight:700,color:T.bright}}>{selEntity.name}</span>
        {selEntity.description&&<span style={{fontSize:9,color:T.dim}}>{selEntity.description}</span>}
      </div>
      <EntityDetail entity={selEntity} entities={entities} features={data.features} lambdas={data.lambdas}/>
    </div>}

    {!selEntity&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
      {entities.map(e=><div key={e.name} onClick={()=>setSel(e.name)} style={{padding:"10px 12px",background:T.glass,borderRadius:6,border:`1px solid ${T.border}`,cursor:"pointer"}} onMouseEnter={el=>el.currentTarget.style.borderColor=T.borderA} onMouseLeave={el=>el.currentTarget.style.borderColor=T.border}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
          <span style={{fontSize:12,color:T.accent}}>◆</span>
          <span style={{fontSize:11,fontWeight:700,color:T.bright}}>{e.name}</span>
        </div>
        <div style={{fontSize:8,color:T.dim,marginBottom:6}}>{e.description||''}</div>
        <div style={{display:"flex",gap:6,fontSize:8}}>
          <span style={{color:T.text}}>{(e.fields||[]).length} fields</span>
          <span style={{color:T.violet}}>{(e.relationships||[]).length} rels</span>
          {(e.auth||[]).map(a=><Tag key={a} l={a.split('.')[0]} c={T.dim}/>)}
        </div>
      </div>)}
    </div>}
  </div>;
}

// ─── SHARED WORK-LOG + LINKED-DOCS HELPERS ──────────────────
function WorkLogTab({updates,setUpdates}){
  const [note,setNote]=useState('');
  const add=()=>{if(!note.trim())return;setUpdates(p=>[...p,{date:new Date().toISOString().split('T')[0],summary:note,agentRan:false}]);setNote('');};
  const entries=[...(updates||[])].reverse();
  return <div style={{display:"flex",flexDirection:"column",gap:6}}>

// ─── HARNESS RUN MODAL ────────────────────────────────────────
function HarnessRunModal({item,itemType,featureId,onClose,onDone}){
  const [harnessTaskId,setHarnessTaskId]=useState(null);
  const [status,setStatus]=useState(null);
  const [events,setEvents]=useState([]);
  const [running,setRunning]=useState(true);
  const [killed,setKilled]=useState(false);

  const kill=()=>{
    if(harnessTaskId){
      fetch(`/api/harness-kill/${harnessTaskId}`,{method:'POST'});
      setKilled(true);
      setRunning(false);
    }
  };

  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      try{
        // Start harness run
        const r=await fetch('/api/harness-run',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            taskId:item.id,
            taskType:itemType,
            description:item.title||item.brief,
            featureId,
            autoApprove:true,
          })
        });
        const data=await r.json();
        if(!data.ok){throw new Error(data.error||'Failed to start harness');}
        if(cancelled)return;
        setHarnessTaskId(data.harnessTaskId);

        // Open SSE stream
        const es=new EventSource(`/api/harness-stream/${data.harnessTaskId}`);
        es.onmessage=(e)=>{
          if(cancelled){es.close();return;}
          const ev=JSON.parse(e.data);
          if(ev.type==='status'){
            setStatus(ev);
            setEvents(ev.events||[]);
          }
          if(ev.type==='complete'){
            setRunning(false);
            es.close();
            // Auto-sync results back to PM
            fetch('/api/harness-sync',{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({
                taskId:item.id,
                harnessTaskId:data.harnessTaskId,
                taskType:itemType,
                featureId,
              })
            }).then(()=>onDone());
          }
          if(ev.type==='error'){
            setRunning(false);
            es.close();
          }
        };
        es.onerror=()=>{setRunning(false);es.close();};
      }catch(e){if(!cancelled){setRunning(false);}}
    })();
    return()=>{cancelled=true;};
  },[]);

  useEffect(()=>{
    const h=e=>{if(e.key==='Escape'&&!running)onClose();};
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[running,onClose]);

  const phaseOrder=['analysis','pm','design','architecture','implementation','qa','complete'];
  const currentPhase=status?.phase||'analysis';
  const currentIdx=phaseOrder.indexOf(currentPhase);

  const qaGates=[
    {key:'tsc',label:'TypeScript'},
    {key:'no_any_types',label:'No any types'},
    {key:'named_exports',label:'Named exports'},
    {key:'changelog_updated',label:'CHANGELOG'},
  ];

  const agents=status?.agents||[];
  const qaResults=status?.qaResults||{};

  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:9500,display:"flex",justifyContent:"center",alignItems:"center"}} onClick={e=>{if(e.target===e.currentTarget&&!running)onClose();}}>
    <div style={{width:720,maxHeight:"85vh",background:"#0a0a14",border:`1px solid ${running?"rgba(139,92,246,0.5)":killed?"rgba(239,68,68,0.5)":T.green+"50"}`,borderRadius:10,overflow:"hidden",display:"flex",flexDirection:"column"}}>
      {/* Header */}
      <div style={{padding:"10px 14px",borderBottom:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:8}}>
        <span style={{width:8,height:8,borderRadius:"50%",background:running?T.violet:killed?T.red:T.green,flexShrink:0,animation:running?"pulse 1s infinite":undefined}}/>
        <span style={{fontSize:9,fontWeight:700,letterSpacing:"0.12em",flex:1,color:running?T.violet:killed?T.red:T.green}}>
          {running?`🤖 HARNESS RUNNING — ${item.title}`:killed?`✕ KILLED — ${item.title}`:`✓ DONE — ${item.title}`}
        </span>
        {running&&<Btn v="ghost" sx={{padding:"3px 10px",fontSize:8,borderColor:"rgba(239,68,68,0.5)",color:T.red}} onClick={kill}>■ Kill</Btn>}
        {!running&&<Btn v="ghost" sx={{padding:"3px 10px",fontSize:8}} onClick={onClose}>Close ✕</Btn>}
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"14px",display:"flex",flexDirection:"column",gap:12}}>
        {/* Phase Pipeline */}
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          {phaseOrder.map((p,i)=>{
            const done=i<currentIdx;
            const active=i===currentIdx;
            return <React.Fragment key={p}>
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                <div style={{width:28,height:28,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,
                  background:done?T.green:active?T.violet:T.bg,
                  color:done||active?"#fff":T.dim,
                  border:`1px solid ${done?T.green:active?T.violet:T.border}`,
                }}>{done?'✓':i+1}</div>
                <span style={{fontSize:7,textTransform:"uppercase",letterSpacing:"0.1em",color:active?T.violet:done?T.green:T.dim}}>{p}</span>
              </div>
              {i<phaseOrder.length-1&&<div style={{flex:1,height:2,background:i<currentIdx?T.green:T.border,borderRadius:1}}/>}
            </React.Fragment>;
          })}
        </div>

        {/* Active Agents */}
        {agents.length>0&&<div style={{display:"flex",flexDirection:"column",gap:6}}>
          <div style={{fontSize:8,fontWeight:700,color:T.dim,letterSpacing:"0.15em",textTransform:"uppercase"}}>Active Agents</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {agents.map(a=><div key={a.role} style={{padding:"6px 10px",background:T.surface,borderRadius:6,border:`1px solid ${a.status==='running'?T.violet+'50':a.status==='completed'?T.green+'50':T.border}`,display:"flex",alignItems:"center",gap:6}}>
              <span style={{width:6,height:6,borderRadius:"50%",background:a.status==='running'?T.violet:a.status==='completed'?T.green:T.dim,animation:a.status==='running'?"pulse 1s infinite":undefined}}/>
              <span style={{fontSize:9,fontWeight:700,color:T.bright,textTransform:"uppercase"}}>{a.role}</span>
              <span style={{fontSize:7,color:a.status==='running'?T.violet:a.status==='completed'?T.green:T.dim}}>{a.status}</span>
              {a.changedFiles?.length>0&&<span style={{fontSize:7,color:T.dim}}>{a.changedFiles.length} files</span>}
            </div>)}
          </div>
        </div>}

        {/* QA Gates */}
        {Object.keys(qaResults).length>0&&<div style={{display:"flex",flexDirection:"column",gap:6}}>
          <div style={{fontSize:8,fontWeight:700,color:T.dim,letterSpacing:"0.15em",textTransform:"uppercase"}}>Quality Gates</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {qaGates.map(g=>{
              const r=qaResults[g.key];
              return <div key={g.key} style={{padding:"4px 8px",borderRadius:4,fontSize:8,fontWeight:700,
                background:r?r.passed?'rgba(16,185,129,0.1)':'rgba(239,68,68,0.1)':T.bg,
                color:r?r.passed?T.green:T.red:T.dim,
                border:`1px solid ${r?r.passed?T.green+'30':T.red+'30':T.border}`,
              }}>
                {r?r.passed?'✓':'✗':''} {g.label}
              </div>;
            })}
          </div>
        </div>}

        {/* Event Log */}
        <div style={{flex:1,background:"#05050f",borderRadius:6,padding:"10px",fontSize:8,color:"rgba(255,255,255,0.55)",lineHeight:1.7,overflowY:"auto",maxHeight:200}}>
          {events.length===0&&<span style={{color:T.dim,animation:"pulse 1s infinite"}}>Waiting for telemetry events…</span>}
          {events.map((e,i)=><div key={i} style={{display:"flex",gap:6,alignItems:"baseline"}}>
            <span style={{color:T.dim,flexShrink:0}}>{new Date(e.timestamp).toLocaleTimeString()}</span>
            <span style={{color:e.event_type==='error'?T.red:e.event_type==='phase_transition'?T.violet:T.accent,flexShrink:0,fontWeight:700}}>{e.event_type}</span>
            <span style={{color:T.text}}>{JSON.stringify(e.details||{}).slice(0,120)}</span>
          </div>)}
        </div>
      </div>

      {/* Result footer */}
      {status?.result&&<div style={{padding:"10px 14px",borderTop:`1px solid ${T.border}`,background:"rgba(16,185,129,0.06)"}}>
        <div style={{fontSize:9,color:T.green,fontWeight:700,marginBottom:4}}>✓ {status.result.workflow_status||'complete'}</div>
        {status.result.changed_files?.length>0&&<div style={{fontSize:8,color:T.dim}}>Files changed: {status.result.changed_files.join(', ')}</div>}
        <div style={{fontSize:8,color:T.dim,marginTop:2}}>Duration: {Math.round(status.duration||0)}s</div>
      </div>}
    </div>
  </div>;
}

// ─── AGENT RUN MODAL (legacy fallback) ────────────────────────
function AgentRunModal({item,itemType,featureId,onClose,onDone}){
  const [output,setOutput]=useState('');
  const [running,setRunning]=useState(true);
  const [killed,setKilled]=useState(false);
  const [result,setResult]=useState(null);
  const scrollRef=useRef(null);
  const readerRef=useRef(null);

  useEffect(()=>{scrollRef.current?.scrollIntoView({behavior:'smooth'});},[output]);

  const kill=()=>{
    setKilled(true);
    setRunning(false);
    readerRef.current?.cancel();
    setOutput(p=>p+'\n\n[killed by user]');
  };

  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      try{
        const r=await fetch('/api/agent-run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:itemType,id:item.id,featureId})});
        const reader=r.body.getReader();readerRef.current=reader;const dec=new TextDecoder();let buf='';
        while(true){
          const {done,value}=await reader.read();
          if(done||cancelled)break;
          buf+=dec.decode(value,{stream:true});
          const lines=buf.split('\n');buf=lines.pop();
          for(const line of lines){
            if(!line.startsWith('data: '))continue;
            try{
              const ev=JSON.parse(line.slice(6));
              if(ev.type==='output')setOutput(p=>p+ev.text);
              if(ev.type==='done'){setResult(ev);setRunning(false);if(!cancelled)onDone();}
            }catch{}
          }
        }
      }catch(e){if(!cancelled&&!killed){setOutput(p=>p+'\nStream error: '+e.message);setRunning(false);}}
    })();
    return()=>{cancelled=true;};
  },[]);

  useEffect(()=>{
    const h=e=>{if(e.key==='Escape'&&!running)onClose();};
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[running,onClose]);

  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:9500,display:"flex",justifyContent:"center",alignItems:"center"}} onClick={e=>{if(e.target===e.currentTarget&&!running)onClose();}}>
    <div style={{width:700,maxHeight:"85vh",background:"#0a0a14",border:`1px solid ${running?"rgba(139,92,246,0.5)":killed?"rgba(239,68,68,0.5)":T.green+"50"}`,borderRadius:10,overflow:"hidden",display:"flex",flexDirection:"column"}}>
      {/* Header */}
      <div style={{padding:"10px 14px",borderBottom:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:8}}>
        <span style={{width:8,height:8,borderRadius:"50%",background:running?T.violet:killed?T.red:T.green,flexShrink:0,animation:running?"pulse 1s infinite":undefined}}/>
        <span style={{fontSize:9,fontWeight:700,letterSpacing:"0.12em",flex:1,color:running?T.violet:killed?T.red:T.green}}>{running?`🤖 AGENT WORKING — ${item.title}`:killed?`✕ KILLED — ${item.title}`:`✓ DONE — ${item.title}`}</span>
        {running&&<Btn v="ghost" sx={{padding:"3px 10px",fontSize:8,borderColor:"rgba(239,68,68,0.5)",color:T.red}} onClick={kill}>■ Kill</Btn>}
        {!running&&<Btn v="ghost" sx={{padding:"3px 10px",fontSize:8}} onClick={onClose}>Close ✕</Btn>}
      </div>
      {/* Terminal */}
      <div style={{flex:1,overflowY:"auto",padding:"10px 14px",background:"#05050f",fontSize:9,color:"rgba(255,255,255,0.65)",lineHeight:1.75,whiteSpace:"pre-wrap",wordBreak:"break-word",minHeight:280,maxHeight:480}}>
        {output||<span style={{color:T.dim,animation:"pulse 1s infinite"}}>Connecting to Claude…</span>}
        <div ref={scrollRef}/>
      </div>
      {/* Result footer */}
      {result&&<div style={{padding:"10px 14px",borderTop:`1px solid ${T.border}`,background:"rgba(16,185,129,0.06)"}}>
        <div style={{fontSize:9,color:T.green,fontWeight:700,marginBottom:4}}>✓ {result.summary}</div>
        {result.filesChanged?.length>0&&<div style={{fontSize:8,color:T.dim}}>Files changed: {result.filesChanged.join(', ')}</div>}
        {result.nextStatus&&<div style={{fontSize:8,color:T.dim,marginTop:2}}>Status → <span style={{color:T.bright}}>{result.nextStatus}</span></div>}
      </div>}
    </div>
  </div>;
}
