      {/* Header */}
      <div style={{padding:"10px 14px",borderBottom:`1px solid ${T.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:11}}>🐛</span>
          <span style={{fontSize:10,fontWeight:700,color:T.bright}}>{b.id}</span>
          <Tag l={b.severity||'P2'} c={b.severity==='P0'?T.red:T.orange}/>
          <Tag l={b.status||'open'} c={b.status==='closed'?T.green:T.red}/>
          {feature&&<Tag l={feature.name} c={T.accent}/>}
        </div>
        <Btn v="sync" sx={{padding:"4px 11px",fontSize:8}} onClick={()=>onRunAgent(b,'bug',feature?.id)}>▶ Run Agent</Btn>
      </div>
      {/* Tabs */}
      <div className="tab-bar" style={{padding:"0 14px",margin:0,flexShrink:0}}>
        {tabDefs.map(tb=><button key={tb.id} className={`tab-btn${tab===tb.id?' active':''}`} onClick={()=>setTab(tb.id)}>{tb.label}</button>)}
      </div>
      {/* Body */}
      <div style={{flex:1,overflowY:"auto",padding:14}}>
        {tab==='details'&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
          <Input value={b.title} onChange={v=>setB(p=>({...p,title:v}))} placeholder="Bug title"/>
          <div style={{display:"flex",gap:6}}>
            <Select value={b.severity||'P2'} onChange={v=>setB(p=>({...p,severity:v}))} options={[{value:'P0',label:'P0 Critical'},{value:'P1',label:'P1 High'},{value:'P2',label:'P2 Medium'}]}/>
            <Select value={b.status||'open'} onChange={v=>setB(p=>({...p,status:v}))} options={[{value:'open',label:'Open'},{value:'closed',label:'Closed'}]}/>
          </div>
          <TextArea value={b.description||''} onChange={v=>setB(p=>({...p,description:v}))} placeholder="Description — what's wrong?" rows={4}/>
          <TextArea value={b.stepsToReproduce||''} onChange={v=>setB(p=>({...p,stepsToReproduce:v}))} placeholder="Steps to reproduce" rows={3}/>
        </div>}
        {tab==='worklog'&&<WorkLogTab updates={b.workUpdates||[]} setUpdates={v=>setB(p=>({...p,workUpdates:typeof v==='function'?v(p.workUpdates||[]):v}))}/>}
        {tab==='docs'&&<LinkedDocsTab docs={b.linkedDocs||[]} setDocs={v=>setB(p=>({...p,linkedDocs:typeof v==='function'?v(p.linkedDocs||[]):v}))}/>}
      </div>
      {/* Footer */}
      <div style={{padding:"10px 14px",borderTop:`1px solid ${T.border}`,display:"flex",gap:4,justifyContent:"flex-end",flexShrink:0}}>
        <Btn v="ghost" onClick={onClose}>Cancel</Btn>
        <Btn v="primary" onClick={save}>Save</Btn>
      </div>
    </div>
  </div>;
}

function KanbanView({data,tasks,saveTasks,onReload,toast}){
  const [filter,setFilter]=useState({priority:null,featureId:null});
  const [dragId,setDragId]=useState(null);
  const [quickAdd,setQuickAdd]=useState({col:null,title:''});
  const [editTask,setEditTask]=useState(null);
  const [openBug,setOpenBug]=useState(null);   // {bug, feature}
  const [agentModal,setAgentModal]=useState(null); // {item, itemType, featureId}

  const columns=[
    {id:'todo',label:'TODO',color:T.accent},
    {id:'in_progress',label:'IN PROGRESS',color:T.yellow},
    {id:'blocked',label:'BLOCKED',color:T.red},
    {id:'done',label:'DONE',color:T.green},
  ];

  const features=data.features||[];
  const featureName=id=>features.find(f=>f.id===id)?.name||'';

  // Save a bug back to its feature (patches feature.bugs[])
  const saveBug=async(updatedBug,featureId)=>{
    const feat=features.find(f=>f.id===featureId);
    if(!feat)return;
    const updatedFeat={...feat,bugs:(feat.bugs||[]).map(b=>b.id===updatedBug.id?updatedBug:b)};
    await api.post('/api/feature',{feature:updatedFeat});
    onReload();
    toast.show('Bug updated','success');
  };

  // Open the original (unmapped) bug object from data
  const openBugCard=(kanbanItem)=>{
    const feat=features.find(f=>f.id===kanbanItem._featureId);
    const orig=(feat?.bugs||[]).find(b=>b.id===kanbanItem.id);
    if(orig)setOpenBug({bug:orig,feature:feat});
  };

  // Trigger agent modal for any item
  const runAgent=(item,itemType,featureId)=>{
    setEditTask(null);setOpenBug(null);
    setAgentModal({item,itemType,featureId});
  };

  // Flatten all feature bugs into kanban items
  // open → todo, closed → done  (bugs can't be in_progress/blocked via kanban)
  const bugItems=features.flatMap(f=>(f.bugs||[]).map(b=>({
    ...b,
    _type:'bug',
    _featureId:f.id,
    featureId:f.id,
    // map bug status to kanban column
    status: b.status==='closed'?'done':'todo',
    priority: b.severity||'P2',
    brief: b.description||b.stepsToReproduce||'',
  })));

  const allItems=[...tasks,...bugItems];

  const filtered=allItems.filter(t=>{
    if(filter.priority&&t.priority!==filter.priority)return false;
    if(filter.featureId&&t.featureId!==filter.featureId)return false;
    return true;
  });

  const onDragStart=(e,id)=>{setDragId(id);e.dataTransfer.effectAllowed='move';};
  const onDragOver=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';};
  const onDrop=async(e,newStatus)=>{
    e.preventDefault();
    if(!dragId){return;}
    const item=allItems.find(i=>i.id===dragId);
    if(!item){setDragId(null);return;}

    if(item._type==='bug'){
      // Map kanban column back to bug status: done→closed, anything else→open
      const newBugStatus=newStatus==='done'?'closed':'open';
      const feat=features.find(f=>f.id===item._featureId);
      if(feat){
        const updatedFeat={...feat,bugs:(feat.bugs||[]).map(b=>b.id===dragId?{...b,status:newBugStatus}:b)};
        await api.post('/api/feature',{feature:updatedFeat});
        onReload();
        toast.show(`Bug marked ${newBugStatus}`,'success');
      }
    } else {
      saveTasks(tasks.map(t=>t.id===dragId?{...t,status:newStatus}:t));
    }
    setDragId(null);
  };

  const quickAddTask=(colId)=>{
    if(!quickAdd.title.trim())return;
    saveTasks([...tasks,{id:`T-${Date.now()}`,title:quickAdd.title,status:colId,priority:'P1',brief:'',featureId:null,tags:[],subtasks:[],bdd:''}]);
    setQuickAdd({col:null,title:''});
    toast.show('Task added','success');
  };

  const saveTask=(updated)=>{saveTasks(tasks.map(t=>t.id===updated.id?updated:t));toast.show('Task updated','success');};

  return <div>
    {agentModal&&<HarnessRunModal item={agentModal.item} itemType={agentModal.itemType} featureId={agentModal.featureId} onClose={()=>setAgentModal(null)} onDone={()=>{onReload();}}/>}
    {openBug&&<BugModal bug={openBug.bug} feature={openBug.feature} onSave={saveBug} onClose={()=>setOpenBug(null)} onRunAgent={runAgent}/>}
    {editTask&&<TaskModal task={editTask} features={data.features||[]} onSave={saveTask} onClose={()=>setEditTask(null)} onRunAgent={runAgent}/>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <span style={{fontSize:8,fontWeight:700,color:T.dim,letterSpacing:"0.3em"}}>TASK BOARD</span>
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <span style={{fontSize:8,color:T.dim}}>Filter:</span>
        <Select value={filter.priority||''} onChange={v=>setFilter(p=>({...p,priority:v||null}))} options={[{value:'',label:'All priorities'},{value:'P0',label:'P0'},{value:'P1',label:'P1'},{value:'P2',label:'P2'}]} style={{fontSize:8,padding:"3px 6px"}}/>
        <Select value={filter.featureId||''} onChange={v=>setFilter(p=>({...p,featureId:v||null}))} options={[{value:'',label:'All routes'},...features.map(f=>({value:f.id,label:f.name}))]} style={{fontSize:8,padding:"3px 6px"}}/>
      </div>
    </div>

    <div style={{display:"grid",gridTemplateColumns:`repeat(${columns.length},1fr)`,gap:8,alignItems:"start"}}>
      {columns.map(col=>{
        const colItems=filtered.filter(t=>t.status===col.id);
        return <div key={col.id} onDragOver={onDragOver} onDrop={e=>onDrop(e,col.id)} style={{background:T.surface,borderRadius:8,border:`1px solid ${T.border}`,minHeight:200}}>
          <div style={{padding:"8px 10px",borderBottom:`1px solid ${T.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:col.color}}/>
              <span style={{fontSize:8,fontWeight:700,color:T.dim,letterSpacing:"0.2em"}}>{col.label}</span>
            </div>
            <Badge count={colItems.length} color={col.color}/>
          </div>
          <div style={{padding:6,display:"flex",flexDirection:"column",gap:4}}>
            {colItems.map(t=>{
              const isBug=t._type==='bug';
              const hasUpdates=(t.workUpdates||[]).length>0;
              return <div key={t.id} draggable onDragStart={e=>onDragStart(e,t.id)} onClick={()=>{isBug?openBugCard(t):setEditTask(t);}} style={{padding:"8px 10px",background:isBug?T.redD:T.glass,borderRadius:6,border:`1px solid ${dragId===t.id?T.accent:isBug?'rgba(239,68,68,0.25)':T.border}`,cursor:"grab",transition:"border-color 0.15s",position:"relative"}}>
                {/* Run Agent button */}
                <button onClick={e=>{e.stopPropagation();runAgent(isBug?features.find(f=>f.id===t._featureId)?.bugs?.find(b=>b.id===t.id)||t:t, isBug?'bug':'task', isBug?t._featureId:t.featureId);}} title="Run Agent" style={{position:"absolute",top:6,right:6,background:"rgba(139,92,246,0.15)",border:"1px solid rgba(139,92,246,0.3)",borderRadius:3,color:T.violet,fontSize:8,padding:"1px 5px",cursor:"pointer",fontFamily:"inherit",fontWeight:700,lineHeight:"14px"}}>▶</button>
                <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:3,paddingRight:28}}>
                  {isBug&&<span style={{fontSize:8}}>🐛</span>}
                  <Tag l={t.priority} c={t.priority==='P0'?T.red:T.orange}/>
                  {t.featureId&&<Tag l={featureName(t.featureId)} c={isBug?T.red:T.accent}/>}
                  {hasUpdates&&<Tag l={`${(t.workUpdates||[]).length} update${(t.workUpdates||[]).length>1?'s':''}`} c={T.violet}/>}
                </div>
                <div style={{fontSize:10,fontWeight:600,color:T.bright,marginBottom:2}}>{t.title}</div>
                {t.brief&&<div style={{fontSize:8,color:T.dim,lineHeight:1.4}}>{t.brief.slice(0,80)}{t.brief.length>80?'…':''}</div>}
                {!isBug&&t.subtasks?.length>0&&<div style={{fontSize:8,color:T.dim,marginTop:3}}>☑ {t.subtasks.filter(s=>s.done).length}/{t.subtasks.length}</div>}
                {!isBug&&t.dueDate&&<div style={{fontSize:7,color:T.dim,marginTop:2}}>Due: {t.dueDate}</div>}
                {isBug&&t.logged&&<div style={{fontSize:7,color:T.dim,marginTop:2}}>Logged: {t.logged}</div>}
              </div>;
            })}

            {/* Quick add (tasks only) */}
            {quickAdd.col===col.id?<div style={{display:"flex",gap:3}}>
              <Input value={quickAdd.title} onChange={v=>setQuickAdd(p=>({...p,title:v}))} placeholder="Task title" style={{flex:1,fontSize:9,padding:"4px 6px"}}/>
              <Btn v="primary" sx={{padding:"3px 8px",fontSize:8}} onClick={()=>quickAddTask(col.id)}>+</Btn>
            </div>:<button onClick={()=>setQuickAdd({col:col.id,title:''})} style={{width:"100%",padding:"6px",background:"transparent",border:`1px dashed ${T.border}`,borderRadius:4,color:T.dim,fontSize:9,cursor:"pointer",fontFamily:"inherit"}}>+ Add task</button>}
          </div>
        </div>;
      })}
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════════════
//  WORK LOG
// ═══════════════════════════════════════════════════════════════
function LogView({data,onReload,toast}){
  const workLog=data.workLog||[];
  const [showAdd,setShowAdd]=useState(false);
  const [entry,setEntry]=useState({summary:'',type:'feature',tags:''});
  const features=data.features||[];

  const addEntry=async()=>{
    if(!entry.summary.trim())return;
    await api.post('/api/work-log',{summary:entry.summary,type:entry.type,tags:entry.tags.split(',').map(s=>s.trim()).filter(Boolean)});
    setEntry({summary:'',type:'feature',tags:''});
    setShowAdd(false);
    toast.show('Work logged','success');
    onReload();
  };

  const tc={feature:T.accent,bugfix:T.red,infrastructure:T.violet,documentation:T.yellow,decision:T.orange,refactor:T.text,chore:T.dim};

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <span style={{fontSize:8,fontWeight:700,color:T.dim,letterSpacing:"0.3em"}}>WORK LOG</span>
      <div style={{display:"flex",gap:6}}>
        <Btn onClick={()=>setShowAdd(true)}>+ LOG WORK</Btn>
        <Btn v="ghost" onClick={()=>{
          const md=workLog.slice(-10).reverse().map(e=>`- **${e.date}** [${e.type||'log'}] ${e.summary}`).join('\n');
          navigator.clipboard.writeText(`## Standup Summary\n\n${md}`);
          toast.show('Copied to clipboard','success');
        }}>📋 COPY STANDUP</Btn>
      </div>
    </div>

    {showAdd&&<Card title="LOG WORK" style={{marginBottom:12}} ch={<div style={{display:"flex",flexDirection:"column",gap:5}}>
      <TextArea value={entry.summary} onChange={v=>setEntry(p=>({...p,summary:v}))} placeholder="What did you work on?" rows={2}/>
      <div style={{display:"flex",gap:6}}>
        <Select value={entry.type} onChange={v=>setEntry(p=>({...p,type:v}))} options={[{value:'feature',label:'Feature'},{value:'bugfix',label:'Bugfix'},{value:'refactor',label:'Refactor'},{value:'infrastructure',label:'Infrastructure'},{value:'documentation',label:'Documentation'},{value:'decision',label:'Decision'}]}/>
        <Input value={entry.tags} onChange={v=>setEntry(p=>({...p,tags:v}))} placeholder="Tags (comma separated)" style={{flex:1}}/>
      </div>
      <div style={{display:"flex",gap:4,justifyContent:"flex-end"}}><Btn v="ghost" onClick={()=>setShowAdd(false)}>Cancel</Btn><Btn v="primary" onClick={addEntry}>Log</Btn></div>
    </div>}/>}

    {workLog.length?<div style={{position:"relative",paddingLeft:16}}>
      <div style={{position:"absolute",left:4,top:0,bottom:0,width:1,background:T.border}}/>
      {[...workLog].reverse().map((e,i)=>{const c=tc[e.type]||T.dim;
        return <div key={i} style={{position:"relative",marginBottom:10,paddingBottom:10,borderBottom:`1px solid ${T.border}`}}>
          <div style={{position:"absolute",left:-14,top:3,width:7,height:7,borderRadius:"50%",background:T.bg,border:`2px solid ${c}`}}/>
          <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3}}><Tag l={e.type||"log"} c={c}/>{(e.tags||[]).filter(t=>t!==e.type).map(t=><Tag key={t} l={t} c={T.accent}/>)}</div>
              <div style={{fontSize:10,color:T.text,lineHeight:1.5}}>{e.summary}</div>
              {e.commit&&<div style={{fontSize:8,color:T.dim,marginTop:2}}>{e.commit.slice(0,7)}</div>}
            </div>
            <span style={{fontSize:8,color:T.dim,flexShrink:0}}>{e.date}</span>
          </div>
        </div>;
      })}
    </div>:<EmptyState icon="📋" text="No entries yet. Log work or run a sync."/>}
  </div>;
}

// ═══════════════════════════════════════════════════════════════
//  APP
// ═══════════════════════════════════════════════════════════════
function App(){
  const [view,setView]=useState(()=>localStorage.getItem('pm-view')||'overview');
  const [selPage,setSelPage]=useState(()=>localStorage.getItem('pm-selPage')||null);
  const [data,setData]=useState(null);
  const [tasks,setTasks]=useState([]);
  const [syncing,setSyncing]=useState(null);
  const [syncOutput,setSyncOutput]=useState("");
  const [syncOutputId,setSyncOutputId]=useState(null);
  const [searchOpen,setSearchOpen]=useState(false);
  const toast=useToast();

  // Persist view
  useEffect(()=>{localStorage.setItem('pm-view',view)},[view]);
  useEffect(()=>{if(selPage)localStorage.setItem('pm-selPage',selPage)},[selPage]);

  const load=async()=>{const r=await fetch("/api/data");const d=await r.json();setData(d);setTasks(d.tasks||[]);};
  useEffect(()=>{load();},[]);

  // Keyboard shortcuts
  useEffect(()=>{
    const handler=e=>{
      if(e.metaKey&&e.key==='k'){e.preventDefault();setSearchOpen(true);return;}
      if(searchOpen||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
      if(e.key==='1')setView('overview');
      if(e.key==='2')setView('routes');
      if(e.key==='3')setView('kanban');
      if(e.key==='4')setView('lambdas');
      if(e.key==='5')setView('data');
      if(e.key==='6')setView('log');
      if(e.key==='/')setSearchOpen(true);
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[searchOpen]);

  const pageSync=async(featureId)=>{
    setSyncing(featureId);setSyncOutputId(featureId);setSyncOutput("");
    try{
      const r=await fetch("/api/page-sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({featureId})});
      const reader=r.body.getReader();const dec=new TextDecoder();let buf="";
      while(true){
        const {done,value}=await reader.read();if(done)break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split("\n");buf=lines.pop();
        for(const line of lines){
          if(!line.startsWith("data: "))continue;
          try{const ev=JSON.parse(line.slice(6));
            if(ev.type==="output")setSyncOutput(p=>p+ev.text);
            if(ev.type==="error")setSyncOutput(p=>p+"\n⚠ "+ev.text+"\n");
            if(ev.type==="done"){if(ev.ok)await load();}
          }catch{}
        }
      }
    }catch(e){setSyncOutput(p=>p+"\nStream error: "+e.message);}
    finally{setSyncing(null);}
  };

  const saveTasks=async u=>{setTasks(u);try{await api.post("/api/tasks",{tasks:u});}catch{}};
  const updateFeature=async u=>{if(!data)return;const features=data.features.map(f=>f.id===u.id?u:f);setData({...data,features});try{await api.post("/api/features",{features});}catch{}};

  const handleSearchNavigate=(result)=>{
    if(result.type==='feature'||result.type==='journey'||result.type==='bug'||result.type==='request'){setView('routes');setSelPage(result.featureId||result.id);}
    if(result.type==='task'){setView('kanban');}
    if(result.type==='lambda'){setView('lambdas');}
    if(result.type==='entity'){setView('data');}
  };

  if(!data)return <div style={{background:T.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:T.dim}}>Loading...</div>;

  const navItems=[
    {id:'overview',label:'Overview',key:'1'},
    {id:'routes',label:'Routes',key:'2'},
    {id:'kanban',label:'Kanban',key:'3'},
    {id:'lambdas',label:'Lambdas',key:'4'},
    {id:'data',label:'Data',key:'5'},
    {id:'log',label:'Log',key:'6'},
  ];

  return <div style={{background:T.bg,minHeight:"100vh",color:T.text}}>
    {toast.el}
    <SearchModal open={searchOpen} onClose={()=>setSearchOpen(false)} onNavigate={handleSearchNavigate}/>

    {/* Header */}
    <div style={{borderBottom:`1px solid ${T.border}`,padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:T.bg,zIndex:100}}>
      <div><span style={{fontSize:13,fontWeight:700,color:T.bright,letterSpacing:"0.08em"}}><span style={{color:T.accent}}>◆</span> PIPE OS</span><span style={{fontSize:9,color:T.dim,marginLeft:10,letterSpacing:"0.15em"}}>PM COMMAND CENTER</span></div>
      <div style={{display:"flex",alignItems:"center",gap:3}}>
        {navItems.map(v=><button key={v.id} onClick={()=>{setView(v.id);if(v.id!=='routes')setSelPage(null);}} style={{background:view===v.id?T.hover:"transparent",border:`1px solid ${view===v.id?T.borderA:"transparent"}`,borderRadius:3,padding:"5px 11px",color:view===v.id?T.bright:T.dim,fontSize:9,fontWeight:700,cursor:"pointer",fontFamily:"inherit",letterSpacing:"0.12em",textTransform:"uppercase"}} title={`${v.key}`}>{v.label}</button>)}
        <button onClick={()=>setSearchOpen(true)} style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:3,padding:"5px 11px",color:T.dim,fontSize:9,cursor:"pointer",fontFamily:"inherit",marginLeft:8}} title="⌘K">⌘K Search</button>
        {syncing&&<div style={{marginLeft:8,fontSize:9,color:T.violet,animation:"pulse 1s infinite"}}>⚡ Claude reading...</div>}
      </div>
    </div>

    {/* Content */}
    <div style={view==='routes'?{}:{padding:"16px",maxWidth:1400,margin:"0 auto"}}>
      {view==='overview'&&<Overview data={data} setView={setView} setSelPage={setSelPage} toast={toast} onReload={onReload}/>}
      {view==='routes'&&<RoutesView data={data} selPage={selPage} setSelPage={setSelPage} onUpdateFeature={updateFeature} onSync={pageSync} syncing={syncing} syncOutput={syncOutput} syncOutputId={syncOutputId} tasks={tasks} saveTasks={saveTasks} toast={toast}/>}
      {view==='kanban'&&<KanbanView data={data} tasks={tasks} saveTasks={saveTasks} onReload={load} toast={toast}/>}
      {view==='lambdas'&&<LambdasView data={data} onReload={load} toast={toast}/>}
      {view==='data'&&<DataView data={data} onReload={load} toast={toast}/>}
      {view==='log'&&<LogView data={data} onReload={load} toast={toast}/>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
